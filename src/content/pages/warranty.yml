de:
  title: 715IND Garantie
  intro: Registriere dein Produkt innerhalb von 15 Tagen nach dem Kauf, um die 715IND Garantie zu aktivieren.
  table_product: Produkt
  table_term: Garantie
  items:
  - product: ranger
    term: 2 Jahre (Bike oder Rahmen).
  - product: enduro-ht-v31
    term: 2 Jahre.
  - product: kaze-xc
    term: 1 Jahr.
  - product: ultra-35-stem
    term: 5 Jahre.
  - product: riser-bar-35
    term: Lebenslang.
  - product: trail-rear-hub
    term: 'Achse: 1 Jahr. Nabenkörper: lebenslang. Rest der Nabe: gesetzliche Gewährleistung, Wartung durch den Besitzer.'
  - product: ultra-rear-hub
    term: 'Achse: 1 Jahr. Nabenkörper: lebenslang. Rest der Nabe: gesetzliche Gewährleistung, Wartung durch den Besitzer.'
  - product: front-hub-15x110
    term: 'Achse: 1 Jahr. Nabenkörper: lebenslang. Rest der Nabe: gesetzliche Gewährleistung, Wartung durch den Besitzer.'
  - product: e30-ultra-rim
    term: 2 Jahre bei Herstellungsfehlern, gelöster Felgennaht und gerissenen Speichenlöchern.
  - product: enduro-h30-rim
    term: 1 Jahr bei Herstellungsfehlern, gelöster Felgennaht und gerissenen Speichenlöchern. Muss mit Nippelscheiben aufgebaut werden.
  - product: custom-wheels
    term: Jede Komponente hat ihre eigene Garantie (Felgen und Naben).
  - product: goat-saddle
    term: 1 Jahr.
  - product: racing-line-saddle
    term: 1 Jahr.
  conditions_heading: Bedingungen
  conditions:
  - Registriere dein Produkt innerhalb von 15 Tagen nach dem Kauf. Ohne Registrierung keine 715IND Garantie.
  - Die Garantie beantragt die Person, die das Produkt registriert hat, mit Fotos des Schadens.
  - Gilt für Produkte, die in Chile und Bolivien gekauft wurden.
  - Keine Garantie deckt Versandkosten.
  - Die gesetzliche Gewährleistung deines Landes gilt immer.
  crash_heading: Crash Replacement
  crash_text: Wird dein registriertes Produkt bei einem Unfall beschädigt, beantrage ein Crash Replacement mit 30 % Rabatt auf ein neues Produkt. Gilt einmal pro Produkt und nur für die Person, die es registriert hat, mit Fotos des Schadens. Nach der Freigabe bitten wir um ein Foto des zerschnittenen (unbrauchbar gemachten) Produkts. Versand nicht inbegriffen.
  maintenance_heading: Wartung der Naben
  maintenance_text: Wir empfehlen, die Naben alle 4 Monate zu reinigen. Die Wartung liegt beim Besitzer; wir schicken dir eine Erinnerung per E-Mail.
  register_title: Registriere deine 715
  register_intro: Registriere dein Produkt innerhalb von 15 Tagen nach dem Kauf, um die 715IND Garantie zu aktivieren.
  claim_title: Garantie beantragen
  claim_intro: Erzähl uns, was passiert ist, und lade Fotos des Schadens hoch. Wir antworten per E-Mail.
fr:
  title: Garantie 715IND
  intro: Enregistre ton produit dans les 15 jours suivant l'achat pour activer la garantie 715IND.
  table_product: Produit
  table_term: Garantie
  items:
  - product: ranger
    term: 2 ans (vélo ou cadre).
  - product: enduro-ht-v31
    term: 2 ans.
  - product: kaze-xc
    term: 1 an.
  - product: ultra-35-stem
    term: 5 ans.
  - product: riser-bar-35
    term: À vie.
  - product: trail-rear-hub
    term: 'Axe : 1 an. Corps de moyeu : à vie. Reste du moyeu : garantie légale, entretien à la charge du propriétaire.'
  - product: ultra-rear-hub
    term: 'Axe : 1 an. Corps de moyeu : à vie. Reste du moyeu : garantie légale, entretien à la charge du propriétaire.'
  - product: front-hub-15x110
    term: 'Axe : 1 an. Corps de moyeu : à vie. Reste du moyeu : garantie légale, entretien à la charge du propriétaire.'
  - product: e30-ultra-rim
    term: 2 ans contre les défauts de fabrication, la séparation de la jonction et les trous fissurés.
  - product: enduro-h30-rim
    term: 1 an contre les défauts de fabrication, la séparation de la jonction et les trous fissurés. Doit être monté avec des rondelles d'écrou.
  - product: custom-wheels
    term: Chaque composant a sa propre garantie (jantes et moyeux).
  - product: goat-saddle
    term: 1 an.
  - product: racing-line-saddle
    term: 1 an.
  conditions_heading: Conditions
  conditions:
  - Enregistre ton produit dans les 15 jours suivant l'achat. Sans enregistrement, pas de garantie 715IND.
  - La garantie est demandée par la personne qui a enregistré le produit, avec des photos des dégâts.
  - Valable pour les produits achetés au Chili et en Bolivie.
  - Aucune garantie ne couvre les frais d'envoi.
  - La garantie légale de ton pays s'applique toujours.
  crash_heading: Crash replacement
  crash_text: Si ton produit enregistré est endommagé lors d'une chute, demande un crash replacement avec 30 % de remise sur un produit neuf. Une fois par produit, uniquement par la personne qui l'a enregistré, avec des photos des dégâts. Si c'est accepté, nous te demanderons une photo du produit coupé (rendu inutilisable). Envoi non inclus.
  maintenance_heading: Entretien des moyeux
  maintenance_text: Nous recommandons de nettoyer les moyeux tous les 4 mois. L'entretien est à la charge du propriétaire ; nous t'enverrons un rappel par e-mail.
