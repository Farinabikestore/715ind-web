es:
  title: Garantía 715IND
  intro: Registra tu producto dentro de 15 días desde la compra para activar la garantía 715IND.
  table_product: Producto
  table_term: Garantía
  items:
  - product: ranger
    term: 2 años (bicicleta o cuadro).
  - product: enduro-ht-v31
    term: 2 años.
  - product: kaze-xc
    term: 1 año.
  - product: ultra-35-stem
    term: 5 años.
  - product: riser-bar-35
    term: De por vida.
  - product: trail-rear-hub
    term: 'Eje: 1 año. Cuerpo (body): de por vida. Resto de la maza: garantía legal, con mantención a cargo del cliente.'
  - product: ultra-rear-hub
    term: 'Eje: 1 año. Cuerpo (body): de por vida. Resto de la maza: garantía legal, con mantención a cargo del cliente.'
  - product: front-hub-15x110
    term: 'Eje: 1 año. Cuerpo (body): de por vida. Resto de la maza: garantía legal, con mantención a cargo del cliente.'
  - product: e30-ultra-rim
    term: 2 años ante fallas de fábrica, separación de junturas y hoyos.
  - product: enduro-h30-rim
    term: 1 año ante fallas de fábrica, separación de junturas y hoyos. Debe armarse con golillas de niple (lentejas).
  - product: custom-wheels
    term: Cada componente con su propia garantía (llantas y mazas).
  - product: goat-saddle
    term: 1 año.
  - product: racing-line-saddle
    term: 1 año.
  conditions_heading: Condiciones
  conditions:
  - Registra tu producto dentro de 15 días desde la compra. Sin registro no hay garantía 715IND.
  - La garantía la pide la persona que registró el producto, con fotos del daño.
  - Aplica a productos comprados en Chile y Bolivia.
  - Ninguna garantía cubre gastos de envío.
  - La garantía legal vigente en tu país se aplica siempre.
  crash_heading: Crash replacement
  crash_text: Si tu producto registrado se daña en un accidente, pide un crash replacement con 30% de descuento en un producto nuevo. Aplica una vez por producto y solo lo pide quien lo registró, con fotos del daño. Si lo aprobamos, te pediremos una foto del producto cortado (inutilizado). El envío no está incluido.
  maintenance_heading: Mantención de mazas
  maintenance_text: Recomendamos limpiar las mazas cada 4 meses. La mantención es responsabilidad del cliente; te enviaremos un recordatorio por correo.
  register_title: Registra tu 715
  register_intro: Registra tu producto dentro de 15 días desde la compra para activar la garantía 715IND.
  claim_title: Solicitar garantía
  claim_intro: Cuéntanos qué pasó y sube fotos del daño. Te responderemos por correo.
en:
  title: 715IND warranty
  intro: Register your product within 15 days of purchase to activate the 715IND warranty.
  table_product: Product
  table_term: Warranty
  items:
  - product: ranger
    term: 2 years (bike or frame).
  - product: enduro-ht-v31
    term: 2 years.
  - product: kaze-xc
    term: 1 year.
  - product: ultra-35-stem
    term: 5 years.
  - product: riser-bar-35
    term: Lifetime.
  - product: trail-rear-hub
    term: 'Axle: 1 year. Hub body: lifetime. Rest of the hub: legal warranty, with maintenance by the owner.'
  - product: ultra-rear-hub
    term: 'Axle: 1 year. Hub body: lifetime. Rest of the hub: legal warranty, with maintenance by the owner.'
  - product: front-hub-15x110
    term: 'Axle: 1 year. Hub body: lifetime. Rest of the hub: legal warranty, with maintenance by the owner.'
  - product: e30-ultra-rim
    term: 2 years against manufacturing defects, seam separation and cracked spoke holes.
  - product: enduro-h30-rim
    term: 1 year against manufacturing defects, seam separation and cracked spoke holes. Must be built with nipple washers.
  - product: custom-wheels
    term: Each component carries its own warranty (rims and hubs).
  - product: goat-saddle
    term: 1 year.
  - product: racing-line-saddle
    term: 1 year.
  conditions_heading: Conditions
  conditions:
  - Register your product within 15 days of purchase. No registration, no 715IND warranty.
  - Claims are made by the person who registered the product, with photos of the damage.
  - Applies to products bought in Chile and Bolivia.
  - No warranty covers shipping costs.
  - The legal warranty in your country always applies.
  crash_heading: Crash replacement
  crash_text: If your registered product is damaged in a crash, request a crash replacement with 30% off a new product. It applies once per product and only the person who registered it can request it, with photos of the damage. If approved, we will ask for a photo of the product cut (made unusable). Shipping is not included.
  maintenance_heading: Hub maintenance
  maintenance_text: We recommend cleaning your hubs every 4 months. Maintenance is the owner's responsibility; we will send you an email reminder.
  register_title: Register your 715
  register_intro: Register your product within 15 days of purchase to activate the 715IND warranty.
  claim_title: Warranty claim
  claim_intro: Tell us what happened and upload photos of the damage. We will reply by email.
