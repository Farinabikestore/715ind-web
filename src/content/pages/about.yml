es:
  title: Sobre 715IND
  seo_description: 'Quiénes somos: una marca chilena de componentes MTB diseñados en Santiago y fabricados en Taiwán.'
  blocks:
  - type: hero
    heading: Nosotros
    text: Nacimos en Chile para acercar componentes MTB confiables, buen servicio y calidad que se nota en cada salida.
    image: /uploads/about/portada-715.webp
    cta_label: ''
    cta_link: ''
    cta2_label: ''
    cta2_link: ''
    layout: stacked
  - type: feature
    theme: light
    image_side: right
    heading: Nuestra historia
    text: |
      715IND nace de una idea sencilla: disfrutar el mountain bike no debería significar pagar de más por componentes en los que puedas confiar. Somos una marca chilena creada por y para quienes viven el cerro y conocen las exigencias de cada sendero.

      Un hito importante llegó en 2021 con el lanzamiento de nuestro cuadro **Enduro HT**, diseñado y probado en Chile. Ese proyecto marcó nuestra forma de trabajar: escuchar a los riders, buscar soluciones funcionales y hacer productos pensados para el uso real, no solo para destacar en una ficha técnica.

      Hoy seguimos esa idea con componentes para trail, enduro y descenso. Somos una marca nacida en Chile, con fabricación en Taiwán, que combina conocimiento del terreno, buenas especificaciones y una búsqueda constante de calidad.
    image: /uploads/about/historia-7.webp
    cta_label: ''
    cta_link: ''
  - type: gallery
    heading: El equipo y el taller
    images:
    - /uploads/about/equipo-1.webp
    - /uploads/about/equipo-2.webp
    - /uploads/about/equipo-3.webp
    - /uploads/about/taller-maza.webp
    - /uploads/about/taller-tension.webp
    - /uploads/about/historia-6.webp
  - type: feature
    theme: sage
    image_side: left
    heading: 'Calidad y precio: una combinación que importa'
    text: |
      Creemos que una buena experiencia sobre la bicicleta debe estar al alcance de más personas. Por eso trabajamos con una relación precio/calidad honesta: componentes confiables, bien resueltos y listos para tus rutas, sin que el precio sea una barrera innecesaria.

      No se trata solo de precio. Se trata de cuidar lo importante: materiales, funcionamiento, compatibilidad y durabilidad. Queremos que quien elige 715IND sienta que tomó una buena decisión.
    image: /uploads/about/historia-8.webp
    cta_label: ''
    cta_link: ''
  - type: feature
    theme: light
    image_side: right
    heading: 'Mucho más que componentes: personas y servicio'
    text: |
      Para nosotros, el vínculo con el cliente no termina cuando entregamos un producto. Queremos que cada rider se sienta bien asesorado y seguro con lo que instala en su bicicleta.

      Esa misma idea está en nuestro servicio de taller, sobre todo en el armado de ruedas. Una rueda bien armada exige atención al detalle: compatibilidad entre componentes, centrado preciso y tensión correcta de los rayos.

      **715IND: componentes en los que puedes confiar, servicio cercano y pasión por el MTB.**
    image: /uploads/about/ruedas-a-mano.webp
    cta_label: Abrir el armador
    cta_link: /wheel-builder/
  - type: dealer_cta
    heading: Trabajemos juntos
    text: Si tienes una tienda, un taller o distribuyes componentes MTB, escríbenos.
    cta_label: Contactar al equipo comercial
    cta_link: /contact/
en:
  title: About 715IND
  seo_description: 'Who we are: a Chilean MTB component brand designed in Santiago and made in Taiwan.'
  blocks:
  - type: hero
    heading: About us
    text: Born in Chile to bring reliable MTB components, good service and quality you feel on every ride.
    image: /uploads/about/portada-715.webp
    cta_label: ''
    cta_link: ''
    cta2_label: ''
    cta2_link: ''
    layout: stacked
  - type: feature
    theme: light
    image_side: right
    heading: Our story
    text: |
      715IND comes from a simple idea: enjoying mountain biking shouldn't mean overpaying for components you can trust. We are a Chilean brand made by and for people who live on the mountain and know what every trail demands.

      A key milestone came in 2021 with the launch of our **Enduro HT** frame, designed and tested in Chile. That project shaped the way we work: listen to riders, look for practical solutions and build products made for real use, not just to look good on a spec sheet.

      Today we keep that idea going with components for trail, enduro and downhill. We are a brand born in Chile and made in Taiwan, combining knowledge of the terrain, sound specs and a constant drive for quality.
    image: /uploads/about/historia-7.webp
    cta_label: ''
    cta_link: ''
  - type: gallery
    heading: The team and the workshop
    images:
    - /uploads/about/equipo-1.webp
    - /uploads/about/equipo-2.webp
    - /uploads/about/equipo-3.webp
    - /uploads/about/taller-maza.webp
    - /uploads/about/taller-tension.webp
    - /uploads/about/historia-6.webp
  - type: feature
    theme: sage
    image_side: left
    heading: 'Quality and price: a combination that matters'
    text: |
      We believe a good experience on the bike should be within reach of more people. That's why we work with an honest price/quality ratio: reliable, well-designed components ready for your rides, without price being an unnecessary barrier.

      It's not only about price. It's about getting the important things right: materials, function, compatibility and durability. We want everyone who picks 715IND to feel they made a good choice.
    image: /uploads/about/historia-8.webp
    cta_label: ''
    cta_link: ''
  - type: feature
    theme: light
    image_side: right
    heading: 'More than components: people and service'
    text: |
      For us, the relationship with a customer doesn't end when we deliver a product. We want every rider to feel well advised and confident in what they put on their bike.

      The same idea drives our workshop service, especially wheel building. A well-built wheel takes attention to detail: compatible parts, precise truing and correct spoke tension.

      **715IND: components you can trust, close service and a passion for MTB.**
    image: /uploads/about/ruedas-a-mano.webp
    cta_label: Open the wheel builder
    cta_link: /wheel-builder/
  - type: dealer_cta
    heading: Let's work together
    text: If you run a shop, a workshop or distribute MTB components, write to us.
    cta_label: Contact our sales team
    cta_link: /contact/
