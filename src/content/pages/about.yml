de:
  title: Über 715IND
  seo_description: 'Wer wir sind: eine chilenische MTB-Komponentenmarke, entwickelt in Santiago, gefertigt in Taiwan.'
  blocks:
  - type: hero
    heading: Über uns
    text: Gegründet in Chile, um zuverlässige MTB-Komponenten, guten Service und spürbare Qualität auf jede Ausfahrt zu bringen.
    image: /uploads/about/portada-715.webp
    cta_label: ''
    cta_link: ''
    cta2_label: ''
    cta2_link: ''
    layout: stacked
  - type: feature
    theme: light
    image_side: right
    heading: Unsere Geschichte
    text: |
      715IND entstand aus einer einfachen Idee: Mountainbiken sollte nicht bedeuten, für vertrauenswürdige Komponenten zu viel zu bezahlen. Wir sind eine chilenische Marke von und für Menschen, die in den Bergen zu Hause sind und wissen, was jeder Trail verlangt.

      Ein wichtiger Meilenstein war 2021 der Start unseres **Enduro HT**-Rahmens, entwickelt und getestet in Chile. Dieses Projekt hat unsere Arbeitsweise geprägt: Fahrern zuhören, praktische Lösungen suchen und Produkte für den echten Einsatz bauen – nicht nur fürs Datenblatt.

      Heute führen wir diese Idee mit Komponenten für Trail, Enduro und Downhill fort. Wir sind eine Marke aus Chile mit Fertigung in Taiwan, die Geländekenntnis, durchdachte Spezifikationen und den ständigen Anspruch an Qualität verbindet.
    image: /uploads/about/historia-7.webp
    cta_label: ''
    cta_link: ''
  - type: gallery
    heading: Das Team und die Werkstatt
    images:
    - /uploads/about/equipo-1.webp
    - /uploads/about/equipo-2.webp
    - /uploads/about/equipo-3.webp
    - /uploads/about/taller-maza.webp
    - /uploads/about/taller-tension.webp
    - /uploads/about/historia-6.webp
  - type: feature
    theme: sage
    image_side: left
    heading: 'Qualität und Preis: eine Kombination, die zählt'
    text: |
      Wir finden, dass ein gutes Fahrerlebnis für mehr Menschen erreichbar sein sollte. Deshalb setzen wir auf ein ehrliches Preis-Leistungs-Verhältnis: zuverlässige, gut gelöste Komponenten für deine Touren, ohne dass der Preis zur unnötigen Hürde wird.

      Es geht nicht nur um den Preis. Es geht darum, das Wichtige richtig zu machen: Material, Funktion, Kompatibilität und Haltbarkeit. Wer 715IND wählt, soll das Gefühl haben, eine gute Entscheidung getroffen zu haben.
    image: /uploads/about/historia-8.webp
    cta_label: ''
    cta_link: ''
  - type: feature
    theme: light
    image_side: right
    heading: 'Mehr als Komponenten: Menschen und Service'
    text: |
      Für uns endet die Beziehung zum Kunden nicht mit der Lieferung. Jeder Fahrer soll sich gut beraten und sicher mit dem fühlen, was er an sein Bike baut.

      Dieselbe Idee steckt in unserem Werkstattservice, vor allem im Laufradbau. Ein gut gebautes Laufrad braucht Liebe zum Detail: passende Komponenten, präzises Zentrieren und die richtige Speichenspannung.

      **715IND: Komponenten, denen du vertrauen kannst, persönlicher Service und Leidenschaft fürs MTB.**
    image: /uploads/about/ruedas-a-mano.webp
    cta_label: Zum Konfigurator
    cta_link: /wheel-builder/
  - type: dealer_cta
    heading: Lass uns zusammenarbeiten
    text: Wenn du einen Shop, eine Werkstatt hast oder MTB-Komponenten vertreibst, schreib uns.
    cta_label: Vertrieb kontaktieren
    cta_link: /contact/
fr:
  title: À propos de 715IND
  seo_description: 'Qui sommes-nous : une marque chilienne de composants VTT conçus à Santiago et fabriqués à Taïwan.'
  blocks:
  - type: hero
    heading: À propos
    text: Nés au Chili pour proposer des composants VTT fiables, un bon service et une qualité qui se ressent à chaque sortie.
    image: /uploads/about/portada-715.webp
    cta_label: ''
    cta_link: ''
    cta2_label: ''
    cta2_link: ''
    layout: stacked
  - type: feature
    theme: light
    image_side: right
    heading: Notre histoire
    text: |
      715IND part d'une idée simple : profiter du VTT ne devrait pas obliger à payer trop cher des composants fiables. Nous sommes une marque chilienne créée par et pour ceux qui vivent la montagne et connaissent les exigences de chaque sentier.

      Une étape clé a été le lancement en 2021 de notre cadre **Enduro HT**, conçu et testé au Chili. Ce projet a défini notre façon de travailler : écouter les riders, chercher des solutions concrètes et créer des produits pensés pour l'usage réel, pas seulement pour briller sur une fiche technique.

      Aujourd'hui, nous poursuivons cette idée avec des composants pour le trail, l'enduro et la descente. Nous sommes une marque née au Chili et fabriquée à Taïwan, qui allie connaissance du terrain, bonnes spécifications et recherche constante de qualité.
    image: /uploads/about/historia-7.webp
    cta_label: ''
    cta_link: ''
  - type: gallery
    heading: L'équipe et l'atelier
    images:
    - /uploads/about/equipo-1.webp
    - /uploads/about/equipo-2.webp
    - /uploads/about/equipo-3.webp
    - /uploads/about/taller-maza.webp
    - /uploads/about/taller-tension.webp
    - /uploads/about/historia-6.webp
  - type: feature
    theme: sage
    image_side: left
    heading: 'Qualité et prix : une combinaison qui compte'
    text: |
      Nous pensons qu'une bonne expérience sur le vélo doit être accessible à plus de monde. C'est pourquoi nous misons sur un rapport qualité-prix honnête : des composants fiables, bien conçus et prêts pour vos sorties, sans que le prix soit un obstacle inutile.

      Ce n'est pas qu'une question de prix. Il s'agit de soigner l'essentiel : matériaux, fonctionnement, compatibilité et durabilité. Nous voulons que chaque personne qui choisit 715IND sente qu'elle a fait le bon choix.
    image: /uploads/about/historia-8.webp
    cta_label: ''
    cta_link: ''
  - type: feature
    theme: light
    image_side: right
    heading: 'Bien plus que des composants : des personnes et du service'
    text: |
      Pour nous, la relation avec le client ne s'arrête pas à la livraison. Nous voulons que chaque rider se sente bien conseillé et confiant dans ce qu'il monte sur son vélo.

      La même idée guide notre service atelier, surtout le montage de roues. Une roue bien montée demande de l'attention aux détails : composants compatibles, dévoilage précis et bonne tension des rayons.

      **715IND : des composants fiables, un service proche et la passion du VTT.**
    image: /uploads/about/ruedas-a-mano.webp
    cta_label: Ouvrir le configurateur
    cta_link: /wheel-builder/
  - type: dealer_cta
    heading: Travaillons ensemble
    text: Si vous avez une boutique, un atelier ou distribuez des composants VTT, écrivez-nous.
    cta_label: Contacter l'équipe commerciale
    cta_link: /contact/
it:
  title: Chi siamo
  seo_description: 'Chi siamo: un marchio cileno di componenti MTB progettati a Santiago e prodotti a Taiwan.'
  blocks:
  - type: hero
    heading: Chi siamo
    text: Nati in Cile per offrire componenti MTB affidabili, un buon servizio e una qualità che si sente in ogni uscita.
    image: /uploads/about/portada-715.webp
    cta_label: ''
    cta_link: ''
    cta2_label: ''
    cta2_link: ''
    layout: stacked
  - type: feature
    theme: light
    image_side: right
    heading: La nostra storia
    text: |
      715IND nasce da un'idea semplice: godersi la mountain bike non dovrebbe voler dire pagare troppo per componenti di cui fidarsi. Siamo un marchio cileno creato da e per chi vive la montagna e conosce le esigenze di ogni sentiero.

      Una tappa importante è arrivata nel 2021 con il lancio del nostro telaio **Enduro HT**, progettato e testato in Cile. Quel progetto ha definito il nostro modo di lavorare: ascoltare i rider, cercare soluzioni pratiche e creare prodotti pensati per l'uso reale, non solo per figurare su una scheda tecnica.

      Oggi portiamo avanti questa idea con componenti per trail, enduro e downhill. Siamo un marchio nato in Cile e prodotto a Taiwan, che unisce conoscenza del terreno, buone specifiche e una ricerca costante della qualità.
    image: /uploads/about/historia-7.webp
    cta_label: ''
    cta_link: ''
  - type: gallery
    heading: Il team e l'officina
    images:
    - /uploads/about/equipo-1.webp
    - /uploads/about/equipo-2.webp
    - /uploads/about/equipo-3.webp
    - /uploads/about/taller-maza.webp
    - /uploads/about/taller-tension.webp
    - /uploads/about/historia-6.webp
  - type: feature
    theme: sage
    image_side: left
    heading: 'Qualità e prezzo: una combinazione che conta'
    text: |
      Crediamo che una buona esperienza in bici debba essere alla portata di più persone. Per questo lavoriamo con un rapporto qualità-prezzo onesto: componenti affidabili, ben fatti e pronti per i tuoi giri, senza che il prezzo sia un ostacolo inutile.

      Non è solo una questione di prezzo. Si tratta di curare ciò che conta: materiali, funzionamento, compatibilità e durata. Vogliamo che chi sceglie 715IND senta di aver fatto la scelta giusta.
    image: /uploads/about/historia-8.webp
    cta_label: ''
    cta_link: ''
  - type: feature
    theme: light
    image_side: right
    heading: 'Molto più che componenti: persone e servizio'
    text: |
      Per noi il rapporto con il cliente non finisce con la consegna. Vogliamo che ogni rider si senta ben consigliato e sicuro di ciò che monta sulla sua bici.

      La stessa idea guida il nostro servizio d'officina, soprattutto il montaggio delle ruote. Una ruota ben montata richiede attenzione ai dettagli: componenti compatibili, centratura precisa e giusta tensione dei raggi.

      **715IND: componenti di cui fidarsi, servizio vicino e passione per la MTB.**
    image: /uploads/about/ruedas-a-mano.webp
    cta_label: Apri il configuratore
    cta_link: /wheel-builder/
  - type: dealer_cta
    heading: Lavoriamo insieme
    text: Se hai un negozio, un'officina o distribuisci componenti MTB, scrivici.
    cta_label: Contatta il commerciale
    cta_link: /contact/
