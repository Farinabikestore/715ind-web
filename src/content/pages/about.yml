es:
  title: Sobre 715IND
  seo_description: 'Quiénes somos: una marca chilena de componentes MTB diseñados en Santiago y fabricados en Taiwán.'
  blocks:
  - type: hero
    heading: Hecho por riders en Santiago de Chile.
    text: 715IND nace en un taller de bicicletas. Diseñamos lo que necesitábamos para nuestros propios cerros.
    image: /uploads/products/enduro-h30-rim/enduro-h30-29er-32h-black-4.webp
    cta_label: ''
    cta_link: ''
    cta2_label: ''
    cta2_link: ''
  - type: feature
    theme: light
    image_side: right
    heading: Diseño en Chile, fabricación en Taiwán
    text: |
      Cada pieza se define y se prueba en Chile, en terreno de montaña real. La fabricación la hacen fábricas de Taiwán especializadas en componentes de bicicleta, con aluminios 6061 y 7075-T6.
    image: /uploads/products/ultra-rear-hub/ultra-blk-12x148-4.webp
    cta_label: ''
    cta_link: ''
  - type: feature
    theme: sage
    image_side: left
    heading: Ruedas armadas a mano
    text: |
      Las ruedas 715 se arman y tensan a mano en nuestro taller de Santiago. Conocemos cada combinación de llanta, maza y largo de rayo.
    image: /uploads/products/ultra-wheelset/rueda-trasera-715-1.webp
    cta_label: Abrir el armador
    cta_link: /wheel-builder/
  - type: dealer_cta
    heading: Trabajemos juntos
    text: Si tienes una tienda, un taller o distribuyes componentes MTB, escríbenos.
    cta_label: Contactar al equipo comercial
    cta_link: /contact/
en:
  title: About 715IND
  seo_description: 'Who we are: a Chilean MTB component brand designed in Santiago and made in Taiwan.'
  blocks:
  - type: hero
    heading: Made by riders in Santiago, Chile.
    text: 715IND was born in a bike workshop. We design what we needed for our own trails.
    image: /uploads/products/enduro-h30-rim/enduro-h30-29er-32h-black-4.webp
    cta_label: ''
    cta_link: ''
    cta2_label: ''
    cta2_link: ''
  - type: feature
    theme: light
    image_side: right
    heading: Designed in Chile, made in Taiwan
    text: |
      Every part is specified and tested in Chile, on real mountain terrain. Production is done by Taiwanese factories that specialise in bicycle components, using 6061 and 7075-T6 aluminium.
    image: /uploads/products/ultra-rear-hub/ultra-blk-12x148-4.webp
    cta_label: ''
    cta_link: ''
  - type: feature
    theme: sage
    image_side: left
    heading: Hand-built wheels
    text: |
      715 wheels are laced and tensioned by hand in our Santiago workshop. We know every combination of rim, hub and spoke length.
    image: /uploads/products/ultra-wheelset/rueda-trasera-715-1.webp
    cta_label: Open the wheel builder
    cta_link: /wheel-builder/
  - type: dealer_cta
    heading: Let's work together
    text: If you run a shop, a workshop or distribute MTB components, write to us.
    cta_label: Contact our sales team
    cta_link: /contact/
pt:
  title: Sobre a 715IND
  seo_description: 'Quem somos: uma marca chilena de componentes de MTB projetados em Santiago e fabricados em Taiwan.'
  blocks:
  - type: hero
    heading: Feito por riders em Santiago do Chile.
    text: A 715IND nasceu numa oficina de bicicletas. Projetamos o que precisávamos para as nossas trilhas.
    image: /uploads/products/enduro-h30-rim/enduro-h30-29er-32h-black-4.webp
    cta_label: ''
    cta_link: ''
    cta2_label: ''
    cta2_link: ''
  - type: feature
    theme: light
    image_side: right
    heading: Projeto no Chile, fabricação em Taiwan
    text: |
      Cada peça é definida e testada no Chile, em terreno de montanha real. A fabricação é feita por fábricas de Taiwan especializadas em componentes de bicicleta, com alumínios 6061 e 7075-T6.
    image: /uploads/products/ultra-rear-hub/ultra-blk-12x148-4.webp
    cta_label: ''
    cta_link: ''
  - type: feature
    theme: sage
    image_side: left
    heading: Rodas montadas à mão
    text: |
      As rodas 715 são montadas e tensionadas à mão na nossa oficina em Santiago. Conhecemos cada combinação de aro, cubo e comprimento de raio.
    image: /uploads/products/ultra-wheelset/rueda-trasera-715-1.webp
    cta_label: Abrir o configurador
    cta_link: /wheel-builder/
  - type: dealer_cta
    heading: Vamos trabalhar juntos
    text: Se você tem loja, oficina ou distribui componentes de MTB, escreva para nós.
    cta_label: Falar com o comercial
    cta_link: /contact/
de:
  title: Über 715IND
  seo_description: 'Wer wir sind: eine chilenische MTB-Komponentenmarke, entwickelt in Santiago, gefertigt in Taiwan.'
  blocks:
  - type: hero
    heading: Von Ridern in Santiago de Chile gemacht.
    text: 715IND entstand in einer Fahrradwerkstatt. Wir entwickeln, was wir für unsere eigenen Trails brauchten.
    image: /uploads/products/enduro-h30-rim/enduro-h30-29er-32h-black-4.webp
    cta_label: ''
    cta_link: ''
    cta2_label: ''
    cta2_link: ''
  - type: feature
    theme: light
    image_side: right
    heading: Entwickelt in Chile, gefertigt in Taiwan
    text: |
      Jedes Teil wird in Chile definiert und auf echtem Bergterrain getestet. Gefertigt wird in taiwanischen Werken, die auf Fahrradkomponenten spezialisiert sind, aus 6061- und 7075-T6-Aluminium.
    image: /uploads/products/ultra-rear-hub/ultra-blk-12x148-4.webp
    cta_label: ''
    cta_link: ''
  - type: feature
    theme: sage
    image_side: left
    heading: Handgebaute Laufräder
    text: |
      715 Laufräder werden in unserer Werkstatt in Santiago von Hand eingespeicht und gespannt. Wir kennen jede Kombination aus Felge, Nabe und Speichenlänge.
    image: /uploads/products/ultra-wheelset/rueda-trasera-715-1.webp
    cta_label: Konfigurator öffnen
    cta_link: /wheel-builder/
  - type: dealer_cta
    heading: Lass uns zusammenarbeiten
    text: Wenn du einen Shop, eine Werkstatt hast oder MTB-Komponenten vertreibst, schreib uns.
    cta_label: Vertrieb kontaktieren
    cta_link: /contact/
fr:
  title: À propos de 715IND
  seo_description: 'Qui sommes-nous : une marque chilienne de composants VTT conçus à Santiago et fabriqués à Taïwan.'
  blocks:
  - type: hero
    heading: Fait par des riders à Santiago du Chili.
    text: 715IND est né dans un atelier vélo. Nous concevons ce dont nous avions besoin pour nos propres sentiers.
    image: /uploads/products/enduro-h30-rim/enduro-h30-29er-32h-black-4.webp
    cta_label: ''
    cta_link: ''
    cta2_label: ''
    cta2_link: ''
  - type: feature
    theme: light
    image_side: right
    heading: Conçu au Chili, fabriqué à Taïwan
    text: |
      Chaque pièce est définie et testée au Chili, sur de vrais terrains de montagne. La fabrication est confiée à des usines taïwanaises spécialisées dans les composants de vélo, en aluminium 6061 et 7075-T6.
    image: /uploads/products/ultra-rear-hub/ultra-blk-12x148-4.webp
    cta_label: ''
    cta_link: ''
  - type: feature
    theme: sage
    image_side: left
    heading: Roues montées à la main
    text: |
      Les roues 715 sont rayonnées et tendues à la main dans notre atelier de Santiago. Nous connaissons chaque combinaison de jante, moyeu et longueur de rayon.
    image: /uploads/products/ultra-wheelset/rueda-trasera-715-1.webp
    cta_label: Ouvrir le configurateur
    cta_link: /wheel-builder/
  - type: dealer_cta
    heading: Travaillons ensemble
    text: Si vous avez une boutique, un atelier ou distribuez des composants VTT, écrivez-nous.
    cta_label: Contacter l'équipe commerciale
    cta_link: /contact/
it:
  title: Chi siamo
  seo_description: 'Chi siamo: un marchio cileno di componenti MTB progettati a Santiago e prodotti a Taiwan.'
  blocks:
  - type: hero
    heading: Fatto da rider a Santiago del Cile.
    text: 715IND nasce in un'officina di bici. Progettiamo ciò che ci serviva per i nostri sentieri.
    image: /uploads/products/enduro-h30-rim/enduro-h30-29er-32h-black-4.webp
    cta_label: ''
    cta_link: ''
    cta2_label: ''
    cta2_link: ''
  - type: feature
    theme: light
    image_side: right
    heading: Progettato in Cile, prodotto a Taiwan
    text: |
      Ogni pezzo viene definito e testato in Cile, su vero terreno di montagna. La produzione è affidata a fabbriche di Taiwan specializzate in componenti per bici, con alluminio 6061 e 7075-T6.
    image: /uploads/products/ultra-rear-hub/ultra-blk-12x148-4.webp
    cta_label: ''
    cta_link: ''
  - type: feature
    theme: sage
    image_side: left
    heading: Ruote montate a mano
    text: |
      Le ruote 715 vengono raggiate e tensionate a mano nella nostra officina di Santiago. Conosciamo ogni combinazione di cerchio, mozzo e lunghezza dei raggi.
    image: /uploads/products/ultra-wheelset/rueda-trasera-715-1.webp
    cta_label: Apri il configuratore
    cta_link: /wheel-builder/
  - type: dealer_cta
    heading: Lavoriamo insieme
    text: Se hai un negozio, un'officina o distribuisci componenti MTB, scrivici.
    cta_label: Contatta il commerciale
    cta_link: /contact/
