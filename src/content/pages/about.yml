      Para nós, a relação com o cliente não termina quando entregamos um produto. Queremos que cada rider se sinta bem orientado e seguro com o que instala na bike.

      A mesma ideia está no nosso serviço de oficina, principalmente na montagem de rodas. Uma roda bem montada exige atenção aos detalhes: compatibilidade entre componentes, centragem precisa e tensão correta dos raios.

