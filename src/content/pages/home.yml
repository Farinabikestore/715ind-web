    size: normal
    shade: light
  - type: feature
    theme: sage
    image_side: right
    heading: Nuestra historia
    text: |
      715IND nació en un taller de bicicletas en Santiago. Empezamos diseñando lo que necesitábamos para nuestros propios cerros y hoy hacemos mazas, llantas, ruedas, cuadros y cockpit.

      Cada pieza se define y se prueba en Chile, en terreno de montaña real, y se fabrica en Taiwán con aluminios 6061 y 7075-T6.
    image: /uploads/products/ultra-rear-hub/ultra-blk-12x148-4.webp
    cta_label: Conoce la marca
    cta_link: /about/
  - type: categories
    heading: Línea de productos
  - type: feature
    theme: dark
    image_side: left
    heading: 'Ultra: 612 puntos de enganche'
    text: |
      Seis trinquetes y un ángulo de enganche de 0,55°. La potencia llega a la rueda apenas tocas el pedal.

      Cuerpo de aluminio 7075-T6, eje Boost 12x148 y núcleos HG, Micro Spline y XD.
    image: /uploads/products/ultra-rear-hub/ultra-silver-12x148-32h-612-4.webp
    cta_label: Ver la maza Ultra
    cta_link: /products/ultra-rear-hub/
  - type: feature
    theme: light
    image_side: right
    heading: Enduro HT V3.1
    text: |
      Rígida de enduro con 63° de dirección, tubos delanteros 2 mm más gruesos y doble soldadura en la pipa. Compatible con UDH y SRAM Transmission.
    image: /uploads/products/enduro-ht-v31/enduro-ht-29er-v3-white-udh-6.webp
    cta_label: Ver el cuadro
    cta_link: /products/enduro-ht-v31/
  - type: dealer_cta
    heading: Lleva 715IND a tu país
    text: Buscamos distribuidores internacionales y tiendas en Chile. Te enviamos catálogo, precios y condiciones.
    cta_label: Contactar al equipo comercial
    cta_link: /contact/
en:
  seo_title: 715IND | MTB components designed in Chile
  seo_description: ''
  blocks:
  - type: video_banner
    video: /uploads/videos/armador-715.mp4
    video_mobile: /uploads/videos/armador-715-movil.mp4
    poster: /uploads/videos/armador-715.webp
    eyebrow: New
    heading: Custom wheel builder
    cta_label: Build yours
    cta_link: /wheel-builder/
    size: hero
    shade: none
    text_color: dark
  - type: video_banner
    video: /uploads/videos/715-jere.mp4
    video_mobile: /uploads/videos/715-jere-movil.mp4
    poster: /uploads/videos/715-jere.webp
    cta_label: 715 Rims
    cta_link: /products/#rims
    size: normal
    shade: medium
  - type: slides
    heading: Explore 715IND
    items:
    - image: /uploads/products/enduro-ht-v31/enduro-ht-v3-black-8.webp
      title: Enduro HT V3.1
      text: 29" enduro hardtail with UDH and a 63° head angle. Built to go down hard.
      link: /stories/enduro-ht-v31/
    - image: /uploads/products/ultra-rear-hub/ultra-silver-12x148-32h-612-4.webp
      title: Ultra rear hub
      text: 612 points of engagement and 0.55° of engagement angle. Machined from 7075-T6 aluminium.
      link: /stories/ultra-hub-612/
    - image: /uploads/products/ultra-wheelset/wheelset-715-ind-1.webp
      title: Custom 715 wheels
      text: Choose rim, hub and freehub in the builder. We build them by hand.
      link: /stories/handbuilt-wheels/
    - image: /uploads/products/riser-bar-35/blk_brown-35-clamp-1.webp
      title: Cockpit 35
      text: Riser bar and Ultra stem with 35 mm clamp, in 6061 aluminium.
      link: /stories/cockpit-35/
  - type: video_banner
    video: /uploads/videos/715-jordi.mp4
    video_mobile: /uploads/videos/715-jordi-movil.mp4
    poster: /uploads/videos/715-jordi.webp
    cta_label: Enduro HT V3
    cta_link: /products/enduro-ht-v31/
    size: normal
    shade: light
  - type: feature
    theme: sage
    image_side: right
    heading: Our story
    text: |
      715IND was born in a bike workshop in Santiago, Chile. We started by designing what we needed for our own mountains; today we make hubs, rims, wheels, frames and cockpits.

      Every part is defined and tested in Chile on real mountain terrain, and made in Taiwan from 6061 and 7075-T6 aluminium.
    image: /uploads/products/ultra-rear-hub/ultra-blk-12x148-4.webp
    cta_label: About the brand
    cta_link: /about/
  - type: categories
    heading: Product line
  - type: feature
    theme: dark
    image_side: left
    heading: 'Ultra: 612 engagement points'
    text: |
      Six pawls and a 0.55° engagement angle. Power reaches the wheel the moment you touch the pedal.

      7075-T6 aluminium shell, 12x148 Boost axle and HG, Micro Spline and XD freehubs.
    image: /uploads/products/ultra-rear-hub/ultra-silver-12x148-32h-612-4.webp
    cta_label: See the Ultra hub
    cta_link: /products/ultra-rear-hub/
  - type: feature
    theme: light
    image_side: right
    heading: Enduro HT V3.1
    text: |
      Enduro hardtail with a 63° head angle, 2 mm thicker front tubes and a double weld at the head tube. UDH and SRAM Transmission ready.
    image: /uploads/products/enduro-ht-v31/enduro-ht-29er-v3-white-udh-6.webp
    cta_label: See the frame
    cta_link: /products/enduro-ht-v31/
  - type: dealer_cta
    heading: Bring 715IND to your country
    text: We are looking for international distributors and dealers in Chile. We will send you our catalogue, pricing and terms.
    cta_label: Contact our sales team
    cta_link: /contact/
