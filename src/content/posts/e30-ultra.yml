de:
  title: 'E30 Ultra Felge: gebaut für die härtesten Schläge'
  excerpt: Entwickelt in Chile für Enduro, Downhill und E-Bikes.
  cta_label: Zur E30 Ultra Felge
  body: |
    ## Die Antwort auf das härteste Gelände

    Wo Steine, große Sprünge und Wurzeln keinen Fehler verzeihen, hat die **715IND E30 Ultra** ein klares Ziel: durchhalten. Sie ist für Fahrer gemacht, die ihr Material ans Limit bringen.

    ## Hollow Tech: Stabilität ohne Mehrgewicht

    Das Herzstück der E30 Ultra ist das **Hollow-Tech**-Design: eine verstärkte Hohlkammerwand, die das Aluminium dort konzentriert, wo die Belastung am größten ist.

    - **Verstärkte Innenwände:** nehmen frontale und seitliche Schläge auf.
    - **30 mm Innenweite:** gute Abstützung für voluminöse Reifen, mit mehr Grip und Stabilität in schnellen Kurven.
    - **Weniger Durchschläge:** verstärkte Felgenhörner senken das Risiko, den Reifen am Stein aufzuschneiden (*Snakebite*).

    ## Für Enduro, DH und E-Bikes

    E-Bikes mit ihrem Gewicht und konstanten Drehmoment sowie langhubige Enduro- und Downhill-Bikes belasten Laufräder ununterbrochen. Die E30 Ultra ist dafür gebaut:

    - **Enduro und Downhill:** verträgt harte Kanten und hohe Geschwindigkeiten auf Bergtrails.
    - **E-Bikes:** trägt das Zusatzgewicht von Akku und Motor, ohne an Steifigkeit zu verlieren.

    Mit der E30 Ultra hast du eine Felge für jede Linie am Berg.
fr:
  title: 'Jante E30 Ultra : faite pour les chocs les plus durs'
  excerpt: Conçue au Chili pour l'enduro, la descente et les VTT électriques.
  cta_label: Voir la jante E30 Ultra
  body: |
    ## La réponse aux terrains les plus destructeurs

    Là où les rochers, les gros sauts et les racines ne pardonnent pas, la jante **715IND E30 Ultra** a un objectif clair : tenir. Elle est faite pour les riders qui poussent leur matériel à la limite.

    ## Hollow Tech : de la résistance sans poids en plus

    La clé de l'E30 Ultra est sa conception **Hollow Tech** : une paroi creuse renforcée qui concentre l'aluminium dans les zones les plus sollicitées.

    - **Parois internes renforcées :** elles absorbent les chocs frontaux et latéraux.
    - **30 mm de largeur interne :** un bon maintien des pneus à gros volume, avec plus d'adhérence et de stabilité dans les virages rapides.
    - **Moins de pincements :** les crochets extérieurs épaissis réduisent le risque de couper le pneu contre la roche (*snake bite*).

    ## Pour l'enduro, la DH et les VTTAE

    Les VTT électriques, avec leur poids et leur couple constant, et les vélos d'enduro et de descente à grand débattement malmènent les roues sans répit. L'E30 Ultra est faite pour ça :

    - **Enduro et descente :** elle encaisse les chocs secs et les grandes vitesses sur les sentiers de montagne.
    - **VTTAE :** elle supporte le poids de la batterie et du moteur sans perdre en rigidité.

    Avec l'E30 Ultra, vous avez une jante prête pour toutes les lignes de la montagne.
it:
  title: 'Cerchio E30 Ultra: fatto per i colpi più duri'
  excerpt: Progettato in Cile per enduro, downhill ed e-bike.
  cta_label: Vedi il cerchio E30 Ultra
  body: |
    ## La risposta ai terreni più distruttivi

    Dove rocce, salti grandi e radici non perdonano errori, il cerchio **715IND E30 Ultra** ha uno scopo chiaro: resistere. È pensato per i rider che portano l'attrezzatura al limite.

    ## Hollow Tech: resistenza senza peso in più

    Il cuore dell'E30 Ultra è il design **Hollow Tech**: una parete cava rinforzata che concentra l'alluminio nelle zone più sollecitate.

    - **Pareti interne rinforzate:** assorbono gli urti frontali e laterali.
    - **30 mm di larghezza interna:** ottimo sostegno per pneumatici voluminosi, con più grip e stabilità nelle curve veloci.
    - **Meno pizzicature:** i ganci esterni ispessiti riducono il rischio di tagliare la gomma contro la roccia (*snake bite*).

    ## Per enduro, DH ed e-bike

    Le e-bike, con il loro peso e la coppia costante, e le bici da enduro e downhill a lunga escursione mettono le ruote sotto stress continuo. L'E30 Ultra è fatto per questo:

    - **Enduro e downhill:** regge colpi secchi e alte velocità sui sentieri di montagna.
    - **E-bike:** sopporta il peso extra di batteria e motore senza perdere rigidità.

    Con l'E30 Ultra hai un cerchio pronto per qualsiasi linea in montagna.
