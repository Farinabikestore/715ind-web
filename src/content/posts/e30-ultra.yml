es:
  title: 'Llanta E30 Ultra: hecha para los impactos más duros'
  slug: e30-ultra
  date: '2026-11-02'
  cover: /uploads/products/e30-ultra-rim/e30-ultra-29er-3.webp
  excerpt: Diseñada en Chile para enduro, downhill y bicicletas eléctricas.
  images:
  - /uploads/products/e30-ultra-rim/e30-ultra-29er-1.webp
  - /uploads/products/e30-ultra-rim/e30-ultra-29er-2.webp
  - /uploads/products/e30-ultra-rim/e30-ultra-29er-4.webp
  cta_label: Ver la llanta E30 Ultra
  cta_link: /products/e30-ultra-rim/
  body: |
    ## La respuesta a los terrenos más destructivos

    En disciplinas donde las rocas, los saltos grandes y las raíces no dan margen de error, la llanta **715IND E30 Ultra** nace con un propósito claro: resistir. Está pensada para riders que llevan su equipo al límite.

    ## Tecnología Hollow Tech: resistencia sin peso extra

    La clave estructural de la E30 Ultra es su diseño **Hollow Tech**: una pared hueca reforzada que concentra el aluminio en las zonas de mayor esfuerzo.

    - **Paredes internas reforzadas:** absorben impactos frontales y laterales.
    - **30 mm de ancho interno:** buen soporte para neumáticos de gran volumen, con más agarre y estabilidad en curvas rápidas.
    - **Menos pinchazos por pellizco:** los labios exteriores engrosados reducen el riesgo de cortar el neumático contra la roca (*snake bite*).

    ## Para enduro, DH y e-bikes

    Las e-bikes, por su peso y su torque constante, y las bicicletas de enduro y downhill de gran recorrido castigan las ruedas sin pausa. La E30 Ultra está hecha para eso:

    - **Enduro y downhill:** aguanta impactos secos y velocidades altas en senderos de montaña.
    - **E-bikes:** soporta el peso extra de la batería y el motor sin perder rigidez.

    Con la E30 Ultra tienes una llanta lista para cualquier línea del cerro.
en:
  title: 'E30 Ultra rim: built for the hardest hits'
  excerpt: Designed in Chile for enduro, downhill and e-bikes.
  cta_label: See the E30 Ultra rim
  body: |
    ## The answer to the most destructive terrain

    Where rocks, big jumps and roots leave no room for error, the **715IND E30 Ultra** rim has one clear goal: to hold up. It is made for riders who push their gear to the limit.

    ## Hollow Tech: strength without extra weight

    The E30 Ultra's key feature is its **Hollow Tech** design: a reinforced hollow wall that puts the aluminium where the stress is highest.

    - **Reinforced inner walls:** absorb frontal and side impacts.
    - **30 mm internal width:** solid support for high-volume tyres, with more grip and stability in fast corners.
    - **Fewer pinch flats:** thicker outer hooks lower the risk of cutting the tyre against rock (*snake bite*).

    ## For enduro, DH and e-bikes

    E-bikes, with their weight and constant torque, and long-travel enduro and downhill bikes punish wheels non-stop. The E30 Ultra is built for that:

    - **Enduro and downhill:** takes square-edge hits and high speeds on mountain trails.
    - **E-bikes:** handles the extra weight of battery and motor without losing stiffness.

    With the E30 Ultra you get a rim ready for any line on the mountain.
