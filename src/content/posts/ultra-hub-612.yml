es:
  title: 'Maza Ultra: 612 puntos de enganche'
  slug: ultra-hub-612
  date: 2026-10-21
  cover: /uploads/products/ultra-rear-hub/ultra-silver-12x148-32h-612-4.webp
  excerpt: Por qué el ángulo de enganche se siente en cada pedalada.
  images:
  - /uploads/products/ultra-rear-hub/ultra-blk-12x148-1.webp
  - /uploads/products/ultra-rear-hub/ultra-silver-12x148-32h-612-1.webp
  - /uploads/products/ultra-rear-hub/ultra-blk-12x148-4.webp
  cta_label: Ver la maza Ultra
  cta_link: /products/ultra-rear-hub/
  body: |
    La Ultra es la maza que usamos en nuestras propias ruedas.

    ## Por qué importan 612 puntos

    El ángulo de enganche es lo que gira la rueda antes de que los trinquetes agarren. En la Ultra son **0,55°**: la potencia llega apenas empiezas a pedalear. En una subida técnica, eso es la diferencia entre pasar el escalón o poner el pie.

    ## Construcción

    - 6 trinquetes.
    - Cuerpo mecanizado en aluminio **7075-T6**.
    - Eje Boost 12x148 mm, en 28 o 32 hoyos.
    - Núcleos Shimano HG, Shimano Micro Spline y SRAM XD.
    - Anclaje de disco de 6 pernos.

    ## Mantención

    Recomendamos limpiar la maza cada 4 meses. Si registras tu maza, te avisamos por correo cuando toque.
en:
  title: 'Ultra hub: 612 points of engagement'
  excerpt: Why engagement angle shows up in every pedal stroke.
  cta_label: See the Ultra hub
  body: |
    The Ultra is the hub we run on our own wheels.

    ## Why 612 points matter

    Engagement angle is how far the wheel turns before the pawls bite. On the Ultra it is **0.55°**: power reaches the wheel as soon as you start pedalling. On a technical climb, that is the difference between clearing the step and putting a foot down.

    ## Construction

    - 6 pawls.
    - Body machined from **7075-T6** aluminium.
    - 12x148 mm Boost axle, 28 or 32 holes.
    - Shimano HG, Shimano Micro Spline and SRAM XD freehubs.
    - 6-bolt disc mount.

    ## Maintenance

    We recommend cleaning the hub every 4 months. Register your hub and we will email you when it is due.
pt:
  title: 'Cubo Ultra: 612 pontos de engate'
  excerpt: Por que o ângulo de engate aparece em cada pedalada.
  cta_label: Ver o cubo Ultra
  body: |
    O Ultra é o cubo que usamos nas nossas próprias rodas.

    ## Por que 612 pontos importam

    O ângulo de engate é quanto a roda gira antes de as linguetas engatarem. No Ultra são **0,55°**: a força chega à roda assim que você começa a pedalar. Em uma subida técnica, é a diferença entre passar o degrau ou colocar o pé no chão.

    ## Construção

    - 6 linguetas.
    - Corpo usinado em alumínio **7075-T6**.
    - Eixo Boost 12x148 mm, com 28 ou 32 furos.
    - Núcleos Shimano HG, Shimano Micro Spline e SRAM XD.
    - Fixação de disco de 6 parafusos.

    ## Manutenção

    Recomendamos limpar o cubo a cada 4 meses. Registre seu cubo e avisaremos por e-mail quando for a hora.
de:
  title: 'Ultra Nabe: 612 Eingriffspunkte'
  excerpt: Warum der Eingriffswinkel bei jedem Tritt spürbar ist.
  cta_label: Zur Ultra Nabe
  body: |
    Die Ultra ist die Nabe, die wir in unseren eigenen Laufrädern fahren.

    ## Warum 612 Punkte zählen

    Der Eingriffswinkel ist der Weg, den das Rad dreht, bevor die Sperrklinken greifen. Bei der Ultra sind es **0,55°**: Die Kraft kommt an, sobald du in die Pedale trittst. In einem technischen Anstieg entscheidet das, ob du die Stufe schaffst oder absteigst.

    ## Aufbau

    - 6 Sperrklinken.
    - Körper aus **7075-T6** Aluminium gefräst.
    - 12x148 mm Boost-Achse, 28 oder 32 Löcher.
    - Freiläufe Shimano HG, Shimano Micro Spline und SRAM XD.
    - 6-Loch-Bremsscheibenaufnahme.

    ## Wartung

    Wir empfehlen, die Nabe alle 4 Monate zu reinigen. Registriere deine Nabe und wir erinnern dich per E-Mail.
fr:
  title: 'Moyeu Ultra : 612 points d''engagement'
  excerpt: Pourquoi l'angle d'engagement se ressent à chaque coup de pédale.
  cta_label: Voir le moyeu Ultra
  body: |
    L'Ultra est le moyeu que nous montons sur nos propres roues.

    ## Pourquoi 612 points comptent

    L'angle d'engagement, c'est la rotation de la roue avant que les cliquets n'accrochent. Sur l'Ultra, il est de **0,55°** : la puissance passe dès le premier coup de pédale. En montée technique, c'est la différence entre passer la marche ou poser le pied.

    ## Construction

    - 6 cliquets.
    - Corps usiné en aluminium **7075-T6**.
    - Axe Boost 12x148 mm, 28 ou 32 trous.
    - Corps de roue libre Shimano HG, Shimano Micro Spline et SRAM XD.
    - Fixation de disque 6 trous.

    ## Entretien

    Nous recommandons de nettoyer le moyeu tous les 4 mois. Enregistre ton moyeu et nous te préviendrons par e-mail.
it:
  title: 'Mozzo Ultra: 612 punti di innesto'
  excerpt: Perché l'angolo di innesto si sente a ogni pedalata.
  cta_label: Vedi il mozzo Ultra
  body: |
    L'Ultra è il mozzo che montiamo sulle nostre ruote.

    ## Perché contano 612 punti

    L'angolo di innesto è quanto gira la ruota prima che i cricchetti aggancino. Nell'Ultra è di **0,55°**: la potenza arriva appena inizi a pedalare. In una salita tecnica è la differenza tra superare il gradino o mettere il piede a terra.

    ## Costruzione

    - 6 cricchetti.
    - Corpo lavorato in alluminio **7075-T6**.
    - Asse Boost 12x148 mm, 28 o 32 fori.
    - Corpetti Shimano HG, Shimano Micro Spline e SRAM XD.
    - Attacco disco a 6 viti.

    ## Manutenzione

    Consigliamo di pulire il mozzo ogni 4 mesi. Registra il tuo mozzo e ti avviseremo via e-mail.
