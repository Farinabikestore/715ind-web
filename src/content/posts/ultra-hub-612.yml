es:
  title: 'Maza Ultra: 612 puntos de enganche'
  slug: ultra-hub-612
  date: '2026-10-21'
  cover: /uploads/products/ultra-rear-hub/ultra-silver-12x148-32h-612-4.webp
  excerpt: Transferencia de potencia inmediata, desarrollada en Chile para quienes buscan rendimiento.
  images:
  - /uploads/products/ultra-rear-hub/ultra-blk-12x148-1.webp
  - /uploads/products/ultra-rear-hub/ultra-silver-12x148-32h-612-1.webp
  - /uploads/products/ultra-rear-hub/ultra-blk-12x148-4.webp
  cta_label: Ver la maza Ultra
  cta_link: /products/ultra-rear-hub/
  body: |
    ## La búsqueda de la respuesta instantánea

    En el mountain bike de alto nivel, cada fracción de segundo y cada grado de giro de las bielas cuenta. La maza **Ultra** nace con el objetivo de eliminar los puntos muertos al pedalear. Diseñada para los terrenos más técnicos, ofrece un enganche prácticamente instantáneo que transforma la fuerza de las piernas en tracción pura.

    ## 612 puntos de enganche: el corazón del sistema

    La clave de la Ultra está en la arquitectura interna de su núcleo. Usa un sistema de seis trinquetes, cada uno con tres puntos de contacto simultáneos sobre el *drive ring*. Esta configuración multiplica la frecuencia de acople hasta **612 puntos de enganche**.

    En el sendero, eso significa:

    - **Cero vacíos al pedalear:** elimina los lapsos en vacío al reanudar la marcha en subidas empinadas o pasos de roca.
    - **Sonido distintivo y continuo:** un zumbido uniforme y de alta frecuencia, propio de los componentes de alta gama.
    - **Tracción técnica:** permite correcciones milimétricas de pedal a baja velocidad, donde el equilibrio y la precisión son clave.

    ## Especificaciones y fabricación

    La maza Ultra está fabricada íntegramente en **aluminio 7075**, un material de grado aeroespacial que garantiza máxima rigidez frente a cargas extremas. Su anodizado viene en negro, naranja y plata.

    - **Estándar:** Boost 12x148 mm, con anclaje de disco de 6 pernos.
    - **Núcleos:** Shimano Micro Spline, SRAM XD y Shimano HG.
    - **Perforación:** 28 o 32 hoyos.
    - **Peso:** 350 g.

    ## Mantención simple y sin herramientas

    Pese a su complejidad interna, la Ultra se diseñó pensando en el taller. Sus tapas a presión (*press-fit*) permiten desarmar el núcleo con las manos, sin herramientas especiales. Así es fácil revisar los rodamientos y aplicar aceite o grasa en el *drive ring* para ajustar el sonido y prolongar la vida útil. Recomendamos limpiarla cada 4 meses.
en:
  title: 'Ultra hub: 612 points of engagement'
  excerpt: Instant power transfer, developed in Chile for riders who chase performance.
  cta_label: See the Ultra hub
  body: |
    ## Chasing instant response

    In high-level mountain biking, every fraction of a second and every degree of crank rotation counts. The **Ultra** hub was born to eliminate dead spots when you pedal. Designed for the most technical terrain, it engages almost instantly and turns leg power into pure traction.

    ## 612 points of engagement: the heart of the system

    The key to the Ultra is the internal architecture of its freehub. It uses six pawls, each with three simultaneous contact points on the *drive ring*. This setup multiplies the engagement frequency up to **612 points**.

    On the trail, that means:

    - **No dead spots:** no free play when you get back on the pedals on steep climbs or rock sections.
    - **A distinctive, continuous sound:** an even, high-frequency buzz typical of high-end components.
    - **Technical traction:** millimetre pedal corrections at low speed, where balance and precision are everything.

    ## Specs and manufacturing

    The Ultra hub is made entirely from **7075 aluminium**, an aerospace-grade material that guarantees maximum stiffness under extreme loads. Anodised in black, orange and silver.

    - **Standard:** 12x148 mm Boost, 6-bolt disc mount.
    - **Freehubs:** Shimano Micro Spline, SRAM XD and Shimano HG.
    - **Drilling:** 28 or 32 holes.
    - **Weight:** 350 g.

    ## Simple, tool-free maintenance

    Despite its internal complexity, the Ultra was designed with the workshop in mind. Press-fit end caps let you take the freehub apart by hand, with no special tools. That makes it easy to check the bearings and apply oil or grease to the *drive ring* to tune the sound and extend its life. We recommend cleaning it every 4 months.
pt:
  title: 'Cubo Ultra: 612 pontos de engate'
  excerpt: Transferência de força imediata, desenvolvida no Chile para quem busca desempenho.
  cta_label: Ver o cubo Ultra
  body: |
    ## Em busca da resposta instantânea

    No mountain bike de alto nível, cada fração de segundo e cada grau de giro do pedivela contam. O cubo **Ultra** nasceu para eliminar os pontos mortos na pedalada. Projetado para os terrenos mais técnicos, engata quase instantaneamente e transforma a força das pernas em tração pura.

    ## 612 pontos de engate: o coração do sistema

    O segredo do Ultra está na arquitetura interna do núcleo. São seis linguetas, cada uma com três pontos de contato simultâneos no *drive ring*. Essa configuração multiplica a frequência de engate até **612 pontos**.

    Na trilha, isso significa:

    - **Sem pontos mortos:** nenhuma folga ao voltar a pedalar em subidas íngremes ou trechos de pedra.
    - **Som característico e contínuo:** um zumbido uniforme e de alta frequência, típico dos componentes de ponta.
    - **Tração técnica:** correções milimétricas de pedal em baixa velocidade, onde equilíbrio e precisão são tudo.

    ## Especificações e fabricação

    O cubo Ultra é feito inteiramente em **alumínio 7075**, material de grau aeroespacial que garante máxima rigidez sob cargas extremas. Anodizado em preto, laranja e prata.

    - **Padrão:** Boost 12x148 mm, fixação de disco de 6 parafusos.
    - **Núcleos:** Shimano Micro Spline, SRAM XD e Shimano HG.
    - **Furação:** 28 ou 32 furos.
    - **Peso:** 350 g.

    ## Manutenção simples e sem ferramentas

    Apesar da complexidade interna, o Ultra foi pensado para a oficina. As tampas press-fit permitem desmontar o núcleo com as mãos, sem ferramentas especiais. Assim fica fácil revisar os rolamentos e aplicar óleo ou graxa no *drive ring* para ajustar o som e prolongar a vida útil. Recomendamos limpá-lo a cada 4 meses.
de:
  title: 'Ultra Nabe: 612 Eingriffspunkte'
  excerpt: Sofortige Kraftübertragung, entwickelt in Chile für alle, die Performance suchen.
  cta_label: Zur Ultra Nabe
  body: |
    ## Auf der Suche nach der sofortigen Reaktion

    Im Mountainbiken auf hohem Niveau zählt jeder Sekundenbruchteil und jedes Grad Kurbeldrehung. Die **Ultra** Nabe wurde entwickelt, um Leerwege beim Treten zu eliminieren. Gebaut für technischstes Gelände greift sie nahezu sofort und verwandelt Beinkraft in reine Traktion.

    ## 612 Eingriffspunkte: das Herz des Systems

    Der Schlüssel liegt im Inneren des Freilaufs. Sechs Sperrklinken mit jeweils drei gleichzeitigen Kontaktpunkten am *Drive Ring* vervielfachen die Eingriffsfrequenz auf **612 Punkte**.

    Auf dem Trail heißt das:

    - **Kein Leerweg:** kein Spiel beim Antreten in steilen Anstiegen oder Felspassagen.
    - **Markanter, gleichmäßiger Sound:** ein hochfrequentes Surren, typisch für High-End-Komponenten.
    - **Technische Traktion:** millimetergenaue Pedalkorrekturen bei langsamer Fahrt, wo Balance und Präzision entscheiden.

    ## Spezifikationen und Fertigung

    Die Ultra ist komplett aus **7075 Aluminium** gefertigt, einem Werkstoff aus der Luftfahrt für maximale Steifigkeit unter extremer Last. Eloxiert in Schwarz, Orange und Silber.

    - **Standard:** Boost 12x148 mm, 6-Loch-Bremsscheibenaufnahme.
    - **Freiläufe:** Shimano Micro Spline, SRAM XD und Shimano HG.
    - **Bohrung:** 28 oder 32 Löcher.
    - **Gewicht:** 350 g.

    ## Einfache Wartung ohne Werkzeug

    Trotz der komplexen Technik wurde die Ultra werkstattfreundlich konstruiert. Dank Press-fit-Endkappen lässt sich der Freilauf von Hand zerlegen, ohne Spezialwerkzeug. So lassen sich die Lager leicht prüfen und Öl oder Fett am *Drive Ring* auftragen, um den Sound anzupassen und die Lebensdauer zu verlängern. Wir empfehlen eine Reinigung alle 4 Monate.
fr:
  title: 'Moyeu Ultra : 612 points d''engagement'
  excerpt: Une transmission de puissance immédiate, développée au Chili pour ceux qui recherchent la performance.
  cta_label: Voir le moyeu Ultra
  body: |
    ## À la recherche de la réponse instantanée

    En VTT de haut niveau, chaque fraction de seconde et chaque degré de rotation du pédalier compte. Le moyeu **Ultra** est né pour supprimer les points morts au pédalage. Conçu pour les terrains les plus techniques, il s'engage presque instantanément et transforme la force des jambes en motricité pure.

    ## 612 points d'engagement : le cœur du système

    Tout se joue dans l'architecture interne du corps de roue libre. Six cliquets, chacun avec trois points de contact simultanés sur le *drive ring*, multiplient la fréquence d'engagement jusqu'à **612 points**.

    Sur le sentier, cela veut dire :

    - **Aucun temps mort :** pas de jeu au moment de relancer dans les montées raides ou les passages rocheux.
    - **Un son distinctif et continu :** un bourdonnement régulier et aigu, typique des composants haut de gamme.
    - **Motricité technique :** des corrections de pédale au millimètre à basse vitesse, là où l'équilibre et la précision comptent.

    ## Caractéristiques et fabrication

    Le moyeu Ultra est entièrement fabriqué en **aluminium 7075**, un matériau de qualité aéronautique qui garantit une rigidité maximale sous fortes charges. Anodisé noir, orange ou argent.

    - **Standard :** Boost 12x148 mm, fixation de disque 6 trous.
    - **Corps de roue libre :** Shimano Micro Spline, SRAM XD et Shimano HG.
    - **Perçage :** 28 ou 32 trous.
    - **Poids :** 350 g.

    ## Entretien simple et sans outils

    Malgré sa complexité interne, l'Ultra a été pensé pour l'atelier. Ses embouts press-fit permettent de démonter le corps de roue libre à la main, sans outil spécial. On peut ainsi contrôler les roulements et appliquer de l'huile ou de la graisse sur le *drive ring* pour régler le son et prolonger sa durée de vie. Nous recommandons de le nettoyer tous les 4 mois.
it:
  title: 'Mozzo Ultra: 612 punti di innesto'
  excerpt: Trasferimento di potenza immediato, sviluppato in Cile per chi cerca prestazioni.
  cta_label: Vedi il mozzo Ultra
  body: |
    ## Alla ricerca della risposta istantanea

    Nella mountain bike di alto livello conta ogni frazione di secondo e ogni grado di rotazione delle pedivelle. Il mozzo **Ultra** nasce per eliminare i punti morti in pedalata. Progettato per i terreni più tecnici, ingrana quasi all'istante e trasforma la forza delle gambe in pura trazione.

    ## 612 punti di innesto: il cuore del sistema

    Il segreto dell'Ultra è l'architettura interna del corpetto. Sei cricchetti, ognuno con tre punti di contatto simultanei sul *drive ring*, moltiplicano la frequenza di innesto fino a **612 punti**.

    Sul sentiero significa:

    - **Nessun vuoto:** nessun gioco quando riparti in salite ripide o passaggi rocciosi.
    - **Un suono inconfondibile e continuo:** un ronzio uniforme e acuto, tipico dei componenti di fascia alta.
    - **Trazione tecnica:** correzioni di pedalata millimetriche a bassa velocità, dove equilibrio e precisione sono tutto.

    ## Specifiche e produzione

    Il mozzo Ultra è realizzato interamente in **alluminio 7075**, un materiale di grado aerospaziale che garantisce la massima rigidità sotto carichi estremi. Anodizzato nero, arancione e argento.

    - **Standard:** Boost 12x148 mm, attacco disco a 6 viti.
    - **Corpetti:** Shimano Micro Spline, SRAM XD e Shimano HG.
    - **Foratura:** 28 o 32 fori.
    - **Peso:** 350 g.

    ## Manutenzione semplice e senza attrezzi

    Nonostante la complessità interna, l'Ultra è pensato per l'officina. I tappi press-fit permettono di smontare il corpetto a mano, senza attrezzi speciali. Così è facile controllare i cuscinetti e applicare olio o grasso sul *drive ring* per regolare il suono e allungarne la vita. Consigliamo di pulirlo ogni 4 mesi.
