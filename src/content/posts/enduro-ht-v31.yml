  body: |
    ## De un sueño en pandemia al prototipo inicial

    Fundar una marca nacional de mountain bike desde cero no fue tarea fácil. A los 20 años, Vasco Fariña se embarcó en el diseño de un cuadro de enduro rígido capaz de soportar el trato más duro. Sin embargo, el primer prototipo fabricado en el extranjero llegó con fallas críticas: vainas traseras excesivamente largas (460 mm en rueda 27,5), guiados de cables rudimentarios que complicaban la instalación de frenos y problemas de geometría en las tallas altas que comprometían la comodidad de los riders. Lejos de frenar el proyecto, cada error se convirtió en una lección de ingeniería y de comunicación con proveedores.

    ## Evolución geométrica y compatibilidad total

    Con el aprendizaje de las primeras tandas y la retroalimentación directa de los ciclistas, la marca dio un salto de calidad radical. El diseño evolucionó para corregir la base estructural y ofrecer prestaciones de nivel internacional:

    - **Geometría optimizada:** se acortaron las vainas traseras al máximo para ganar agilidad y se rediseñaron las tallas, con reaches y tubos de asiento más bajos que se adaptan a ciclistas de distintas estaturas.
    - **Versatilidad de ruedas:** la nueva plataforma permite armarla en mullet (29" adelante y 27,5" atrás) o en full 29", según la preferencia de cada rider.
    - **Guiado interno limpio:** se eliminaron los soportes externos, con un enrutamiento limpio, seguro y sin fricción para las líneas de freno y la tija telescópica.

    ## Terminaciones y acabado

    El acabado también cambió por completo. De los prototipos sin pintar entregados por urgencia durante la pandemia, se pasó a trabajar con talleres especializados que garantizan una pintura impecable. Las calcas de alta durabilidad y los detalles estructurales pulidos transformaron el cuadro en una pieza robusta, funcional y atractiva. La V3.1 refleja la madurez de un proyecto hecho a pulso que hoy compite de igual a igual en los senderos más exigentes de Chile.
en:
  title: 'Enduro HT V3.1: a complete evolution'
  excerpt: The enduro hardtail born from scratch in Chile now sets a new standard for technical precision on the toughest trails.
  cta_label: See the frame
  body: |
    ## From a pandemic dream to the first prototype

    Building a Chilean mountain bike brand from scratch was not easy. At 20, Vasco Fariña set out to design an enduro hardtail that could take the hardest abuse. The first prototype, made abroad, arrived with critical flaws: chainstays far too long (460 mm on 27.5" wheels), crude cable routing that made fitting brakes a chore, and geometry problems in the larger sizes that hurt rider comfort. Instead of stopping the project, every mistake became a lesson in engineering and in working with suppliers.

    ## Refined geometry, full compatibility

    With what the first batches taught us and direct feedback from riders, the brand made a radical jump in quality. The design evolved to fix the structural base and deliver international-level performance:

    - **Optimised geometry:** chainstays shortened as far as possible for agility, and redesigned sizes with reach and seat tube lengths that fit riders of different heights.
    - **Wheel versatility:** the new platform can be built as a mullet (29" front, 27.5" rear) or full 29", to suit each rider.
    - **Clean internal routing:** external guides are gone, giving clean, secure, friction-free routing for brake lines and the dropper post.

    ## Finish

    The finish changed completely too. From unpainted prototypes delivered in a rush during the pandemic, we moved to specialist paint shops that guarantee a flawless finish. Durable decals and polished structural details turned the frame into a tough, functional and good-looking piece. The V3.1 reflects the maturity of a project built by hand that now competes head to head on Chile's most demanding trails.
pt:
  title: 'Enduro HT V3.1: evolução total'
  excerpt: O hardtail de enduro que nasceu do zero no Chile hoje redefine a precisão técnica nas trilhas mais exigentes.
  cta_label: Ver o quadro
  body: |
    ## De um sonho na pandemia ao primeiro protótipo

    Criar uma marca chilena de mountain bike do zero não foi fácil. Aos 20 anos, Vasco Fariña começou a projetar um hardtail de enduro capaz de aguentar o uso mais pesado. O primeiro protótipo, fabricado no exterior, chegou com falhas críticas: chainstays longos demais (460 mm em roda 27,5), passagem de cabos rudimentar que complicava a instalação dos freios e problemas de geometria nos tamanhos maiores que prejudicavam o conforto. Em vez de parar o projeto, cada erro virou uma lição de engenharia e de comunicação com fornecedores.

    ## Geometria refinada e compatibilidade total

    Com o aprendizado dos primeiros lotes e o retorno direto dos ciclistas, a marca deu um salto radical de qualidade. O projeto evoluiu para corrigir a base estrutural e oferecer desempenho de nível internacional:

    - **Geometria otimizada:** chainstays encurtados ao máximo para ganhar agilidade e tamanhos redesenhados, com reach e tubo de selim que se adaptam a ciclistas de diferentes alturas.
    - **Versatilidade de rodas:** a nova plataforma pode ser montada em mullet (29" na frente e 27,5" atrás) ou full 29", conforme a preferência de cada rider.
    - **Passagem interna limpa:** os suportes externos foram eliminados, com passagem limpa, segura e sem atrito para os conduítes de freio e o canote retrátil.

    ## Acabamento

    O acabamento também mudou por completo. Dos protótipos sem pintura entregues às pressas durante a pandemia, passamos a trabalhar com oficinas especializadas que garantem uma pintura impecável. Adesivos de alta durabilidade e detalhes estruturais polidos transformaram o quadro em uma peça robusta, funcional e bonita. A V3.1 reflete a maturidade de um projeto feito à mão que hoje compete de igual para igual nas trilhas mais exigentes do Chile.
de:
  title: 'Enduro HT V3.1: die komplette Evolution'
  excerpt: Das in Chile von Grund auf entwickelte Enduro-Hardtail setzt heute neue Maßstäbe für Präzision auf den härtesten Trails.
  cta_label: Zum Rahmen
  body: |
    ## Vom Traum in der Pandemie zum ersten Prototyp

    Eine chilenische Mountainbike-Marke aus dem Nichts aufzubauen, war nicht leicht. Mit 20 Jahren begann Vasco Fariña, ein Enduro-Hardtail zu entwickeln, das härteste Belastungen aushält. Der erste, im Ausland gefertigte Prototyp kam mit gravierenden Mängeln: viel zu lange Kettenstreben (460 mm bei 27,5"), eine primitive Zugführung, die die Bremsmontage erschwerte, und Geometrieprobleme in den großen Rahmengrößen. Statt das Projekt zu stoppen, wurde jeder Fehler zu einer Lektion in Technik und in der Zusammenarbeit mit Lieferanten.

    ## Verfeinerte Geometrie, volle Kompatibilität

    Mit den Erfahrungen aus den ersten Serien und dem direkten Feedback der Fahrer machte die Marke einen großen Qualitätssprung. Das Design wurde weiterentwickelt, um die Basis zu korrigieren und internationales Niveau zu bieten:

    - **Optimierte Geometrie:** so kurze Kettenstreben wie möglich für mehr Wendigkeit und neu entwickelte Größen mit Reach- und Sitzrohrmaßen für Fahrer unterschiedlicher Körpergröße.
    - **Vielseitige Laufräder:** Aufbau als Mullet (vorne 29", hinten 27,5") oder komplett 29", ganz nach Vorliebe.
    - **Saubere interne Zugführung:** keine externen Halter mehr, dafür eine saubere, sichere und reibungsarme Führung für Bremsleitungen und Vario-Stütze.

    ## Finish

    Auch das Finish hat sich komplett verändert. Von unlackierten Prototypen, die während der Pandemie in Eile geliefert wurden, ging es zu spezialisierten Lackierereien mit makellosem Ergebnis. Langlebige Decals und polierte Details machen den Rahmen robust, funktional und schön. Die V3.1 zeigt die Reife eines von Hand aufgebauten Projekts, das heute auf den härtesten Trails Chiles auf Augenhöhe mithält.
fr:
  title: 'Enduro HT V3.1 : l''évolution complète'
  excerpt: Le semi-rigide d'enduro né de zéro au Chili redéfinit aujourd'hui la précision technique sur les sentiers les plus exigeants.
  cta_label: Voir le cadre
  body: |
    ## D'un rêve pendant la pandémie au premier prototype

    Créer une marque chilienne de VTT à partir de rien n'a pas été simple. À 20 ans, Vasco Fariña s'est lancé dans la conception d'un semi-rigide d'enduro capable d'encaisser les pires traitements. Le premier prototype, fabriqué à l'étranger, est arrivé avec des défauts majeurs : bases beaucoup trop longues (460 mm en 27,5"), passage de câbles rudimentaire qui compliquait le montage des freins et problèmes de géométrie dans les grandes tailles. Au lieu d'arrêter le projet, chaque erreur est devenue une leçon d'ingénierie et de communication avec les fournisseurs.

    ## Géométrie affinée, compatibilité totale

    Grâce aux premières séries et aux retours directs des riders, la marque a fait un saut de qualité radical. Le design a évolué pour corriger la base et offrir des performances de niveau international :

    - **Géométrie optimisée :** bases raccourcies au maximum pour gagner en agilité et tailles redessinées, avec des reach et tubes de selle adaptés à différentes morphologies.
    - **Polyvalence des roues :** montage en mulet (29" à l'avant, 27,5" à l'arrière) ou full 29", selon les préférences de chacun.
    - **Passage interne propre :** fini les guides externes, place à un passage propre, sûr et sans frottement pour les durites de frein et la tige télescopique.

    ## Finitions

    Les finitions ont elles aussi complètement changé. Des prototypes non peints livrés en urgence pendant la pandémie, nous sommes passés à des ateliers spécialisés qui garantissent une peinture impeccable. Des stickers durables et des détails polis font du cadre une pièce robuste, fonctionnelle et belle. La V3.1 reflète la maturité d'un projet construit à la main, qui rivalise aujourd'hui sur les sentiers les plus exigeants du Chili.
it:
  title: 'Enduro HT V3.1: un''evoluzione completa'
  excerpt: La front da enduro nata da zero in Cile oggi ridefinisce la precisione tecnica sui sentieri più impegnativi.
  cta_label: Vedi il telaio
  body: |
    ## Da un sogno in pandemia al primo prototipo

    Fondare un marchio cileno di mountain bike da zero non è stato facile. A 20 anni, Vasco Fariña ha iniziato a progettare una front da enduro capace di sopportare l'uso più duro. Il primo prototipo, prodotto all'estero, è arrivato con difetti gravi: foderi posteriori troppo lunghi (460 mm con ruota 27,5"), passaggio cavi rudimentale che complicava il montaggio dei freni e problemi di geometria nelle taglie grandi. Invece di fermare il progetto, ogni errore è diventato una lezione di ingegneria e di comunicazione con i fornitori.

    ## Geometria rifinita, compatibilità totale

    Con l'esperienza dei primi lotti e il feedback diretto dei rider, il marchio ha fatto un salto di qualità radicale. Il progetto si è evoluto per correggere la base strutturale e offrire prestazioni di livello internazionale:

    - **Geometria ottimizzata:** foderi accorciati al massimo per guadagnare agilità e taglie riprogettate, con reach e tubi sella adatti a rider di diverse altezze.
    - **Versatilità delle ruote:** si monta mullet (29" davanti e 27,5" dietro) o full 29", secondo le preferenze.
    - **Passaggio interno pulito:** eliminati i supporti esterni, con un passaggio pulito, sicuro e senza attriti per tubi freno e reggisella telescopico.

    ## Finiture

    Anche le finiture sono cambiate del tutto. Dai prototipi non verniciati consegnati in fretta durante la pandemia si è passati a officine specializzate che garantiscono una verniciatura impeccabile. Decalcomanie resistenti e dettagli lucidati hanno reso il telaio robusto, funzionale e bello. La V3.1 riflette la maturità di un progetto costruito a mano, che oggi compete alla pari sui sentieri più impegnativi del Cile.
