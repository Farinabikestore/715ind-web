es:
  title: 'Enduro HT V3.1: más firme donde más se exige'
  slug: enduro-ht-v31
  date: 2026-10-28
  cover: /uploads/products/enduro-ht-v31/enduro-ht-v3-black-8.webp
  excerpt: Qué cambiamos en nuestra rígida de enduro y por qué.
  images:
  - /uploads/products/enduro-ht-v31/enduro-ht-29er-v3-white-udh-6.webp
  - /uploads/products/enduro-ht-v31/enduro-ht-29er-v3-blue-udh-1.webp
  - /uploads/products/enduro-ht-v31/bike-v3-preventa-1.webp
  cta_label: Ver el cuadro
  cta_link: /products/enduro-ht-v31/
  body: |
    La V3.1 es la nueva versión de nuestra rígida de enduro. Nace de lo que aprendimos con las versiones anteriores: en un cuadro rígido, el frente es la zona que más castigo recibe.

    ## Qué cambió

    - **2 mm más de espesor** en el tubo superior y el tubo diagonal.
    - **Doble cordón de soldadura TIG a mano** en todo el frente.
    - Patilla **UDH**, compatible con SRAM Transmission T-Type.

    ## Geometría para bajar

    Con **63° de dirección** es estable a alta velocidad y precisa en terreno técnico. Se arma en 29", 27,5" o mullet, con eje trasero Boost 12x148 y neumáticos de hasta 2,6".

    ## Tallas

    - **S1:** reach 440 mm, para 160–165 cm.
    - **S2:** reach 470 mm, para 165–185 cm.
    - **S3:** reach 490 mm, para 180–190 cm.

    Disponible como cuadro o bicicleta completa.
en:
  title: 'Enduro HT V3.1: stronger where it matters'
  excerpt: What we changed on our enduro hardtail, and why.
  cta_label: See the frame
  body: |
    The V3.1 is the new version of our enduro hardtail. It comes from what we learned with the earlier versions: on a hardtail, the front end takes the most abuse.

    ## What changed

    - **2 mm thicker** top tube and down tube.
    - **Double hand-laid TIG weld** across the whole front end.
    - **UDH** dropout, compatible with SRAM Transmission T-Type.

    ## Geometry built to descend

    With a **63° head angle** it stays stable at speed and precise on technical ground. Build it as 29", 27.5" or mullet, with a 12x148 Boost rear and tyres up to 2.6".

    ## Sizes

    - **S1:** 440 mm reach, for 160–165 cm.
    - **S2:** 470 mm reach, for 165–185 cm.
    - **S3:** 490 mm reach, for 180–190 cm.

    Available as a frame or a complete bike.
pt:
  title: 'Enduro HT V3.1: mais firme onde mais se exige'
  excerpt: O que mudamos no nosso hardtail de enduro e por quê.
  cta_label: Ver o quadro
  body: |
    A V3.1 é a nova versão do nosso hardtail de enduro. Ela nasce do que aprendemos com as versões anteriores: em um quadro rígido, a parte dianteira é a que mais sofre.

    ## O que mudou

    - **2 mm a mais de espessura** no tubo superior e no tubo inferior.
    - **Cordão duplo de solda TIG à mão** em toda a dianteira.
    - Gancheira **UDH**, compatível com SRAM Transmission T-Type.

    ## Geometria para descer

    Com **63° de caixa de direção**, é estável em alta velocidade e precisa no terreno técnico. Monta em 29", 27,5" ou mullet, com eixo traseiro Boost 12x148 e pneus de até 2,6".

    ## Tamanhos

    - **S1:** reach de 440 mm, para 160–165 cm.
    - **S2:** reach de 470 mm, para 165–185 cm.
    - **S3:** reach de 490 mm, para 180–190 cm.

    Disponível como quadro ou bicicleta completa.
de:
  title: 'Enduro HT V3.1: stärker, wo es zählt'
  excerpt: Was wir an unserem Enduro-Hardtail geändert haben und warum.
  cta_label: Zum Rahmen
  body: |
    Die V3.1 ist die neue Version unseres Enduro-Hardtails. Sie entsteht aus dem, was wir mit den früheren Versionen gelernt haben: Bei einem Hardtail muss die Front am meisten aushalten.

    ## Was neu ist

    - **2 mm mehr Wandstärke** an Ober- und Unterrohr.
    - **Doppelte, von Hand gelegte WIG-Schweißnaht** an der gesamten Front.
    - **UDH**-Ausfallende, kompatibel mit SRAM Transmission T-Type.

    ## Geometrie zum Bergabfahren

    Mit **63° Lenkwinkel** bleibt sie bei hohem Tempo stabil und im technischen Gelände präzise. Aufbau als 29", 27,5" oder Mullet, mit 12x148 Boost hinten und Reifen bis 2,6".

    ## Größen

    - **S1:** 440 mm Reach, für 160–165 cm.
    - **S2:** 470 mm Reach, für 165–185 cm.
    - **S3:** 490 mm Reach, für 180–190 cm.

    Erhältlich als Rahmen oder Komplettbike.
fr:
  title: 'Enduro HT V3.1 : plus solide là où ça compte'
  excerpt: Ce que nous avons changé sur notre semi-rigide d'enduro, et pourquoi.
  cta_label: Voir le cadre
  body: |
    La V3.1 est la nouvelle version de notre semi-rigide d'enduro. Elle naît de ce que nous avons appris avec les versions précédentes : sur un semi-rigide, c'est l'avant qui encaisse le plus.

    ## Ce qui change

    - **2 mm d'épaisseur en plus** sur le tube horizontal et le tube diagonal.
    - **Double cordon de soudure TIG à la main** sur tout l'avant.
    - Patte **UDH**, compatible SRAM Transmission T-Type.

    ## Une géométrie pour descendre

    Avec **63° d'angle de direction**, elle reste stable à haute vitesse et précise en terrain technique. Montage en 29", 27,5" ou mulet, axe arrière Boost 12x148 et pneus jusqu'à 2,6".

    ## Tailles

    - **S1 :** reach de 440 mm, pour 160–165 cm.
    - **S2 :** reach de 470 mm, pour 165–185 cm.
    - **S3 :** reach de 490 mm, pour 180–190 cm.

    Disponible en cadre seul ou vélo complet.
it:
  title: 'Enduro HT V3.1: più robusta dove serve'
  excerpt: Cosa abbiamo cambiato nella nostra front da enduro e perché.
  cta_label: Vedi il telaio
  body: |
    La V3.1 è la nuova versione della nostra front da enduro. Nasce da quello che abbiamo imparato con le versioni precedenti: in una front, l'anteriore è la zona più sollecitata.

    ## Cosa è cambiato

    - **2 mm di spessore in più** su tubo orizzontale e tubo obliquo.
    - **Doppio cordone di saldatura TIG a mano** su tutto l'anteriore.
    - Forcellino **UDH**, compatibile con SRAM Transmission T-Type.

    ## Geometria per scendere

    Con **63° di angolo sterzo** è stabile ad alta velocità e precisa sul tecnico. Si monta 29", 27,5" o mullet, con posteriore Boost 12x148 e gomme fino a 2,6".

    ## Taglie

    - **S1:** reach 440 mm, per 160–165 cm.
    - **S2:** reach 470 mm, per 165–185 cm.
    - **S3:** reach 490 mm, per 180–190 cm.

    Disponibile come telaio o bici completa.
