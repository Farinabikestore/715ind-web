es:
  title: 'Cockpit 35: manillar Riser y tee Ultra'
  slug: cockpit-35
  date: 2026-10-07
  cover: /uploads/products/riser-bar-35/blk_brown-35-clamp-1.webp
  excerpt: Abrazadera de 35 mm para más rigidez y control en terreno técnico.
  images:
  - /uploads/products/riser-bar-35/silver-35-clamp-1.webp
  - /uploads/products/ultra-35-stem/ultra-35-35mm-orange-1.webp
  - /uploads/products/ultra-35-stem/35-35mm-blk-1.webp
  cta_label: Ver el cockpit
  cta_link: /products/#cockpit
  body: |
    El cockpit es el punto de contacto que más controla la bicicleta. Por eso lo diseñamos con abrazadera de **35 mm**.

    ## Manillar Riser 35

    - Aluminio 6061.
    - Elevación de 40 o 50 mm para ajustar tu posición.
    - En plata, platino y negro con gráfica blanca, café o gris.

    Tiene garantía de por vida.

    ## Tee Ultra 35

    - Mecanizada al 100% en aluminio 6061.
    - 35 mm de largo y **120 g**.
    - Pernos de acero con recubrimiento de zinc.
    - En negro, plata o naranja.

    Tiene garantía de 5 años.
en:
  title: 'Cockpit 35: Riser bar and Ultra stem'
  excerpt: A 35 mm clamp for more stiffness and control on technical ground.
  cta_label: See the cockpit
  body: |
    The cockpit is the contact point that controls the bike the most. That is why we designed it around a **35 mm** clamp.

    ## Riser 35 bar

    - 6061 aluminium.
    - 40 or 50 mm rise to fine-tune your position.
    - In silver, platinum and black with white, brown or grey graphics.

    It carries a lifetime warranty.

    ## Ultra 35 stem

    - Fully CNC-machined 6061 aluminium.
    - 35 mm long and **120 g**.
    - Zinc-coated steel bolts.
    - In black, silver or orange.

    It carries a 5-year warranty.
pt:
  title: 'Cockpit 35: guidão Riser e mesa Ultra'
  excerpt: Abraçadeira de 35 mm para mais rigidez e controle no terreno técnico.
  cta_label: Ver o cockpit
  body: |
    O cockpit é o ponto de contato que mais controla a bicicleta. Por isso o desenhamos com abraçadeira de **35 mm**.

    ## Guidão Riser 35

    - Alumínio 6061.
    - Rise de 40 ou 50 mm para ajustar sua posição.
    - Em prata, platina e preto com gráfico branco, marrom ou cinza.

    Tem garantia vitalícia.

    ## Mesa Ultra 35

    - Usinada 100% em alumínio 6061.
    - 35 mm de comprimento e **120 g**.
    - Parafusos de aço com revestimento de zinco.
    - Em preto, prata ou laranja.

    Tem garantia de 5 anos.
de:
  title: 'Cockpit 35: Riser-Lenker und Ultra-Vorbau'
  excerpt: 35 mm Klemmung für mehr Steifigkeit und Kontrolle im technischen Gelände.
  cta_label: Zum Cockpit
  body: |
    Das Cockpit ist der Kontaktpunkt, der das Bike am stärksten steuert. Deshalb haben wir es mit **35 mm** Klemmung entwickelt.

    ## Riser 35 Lenker

    - Aluminium 6061.
    - 40 oder 50 mm Rise für deine Position.
    - In Silber, Platin und Schwarz mit weißer, brauner oder grauer Grafik.

    Mit lebenslanger Garantie.

    ## Ultra 35 Vorbau

    - Komplett CNC-gefräst aus Aluminium 6061.
    - 35 mm lang und **120 g**.
    - Verzinkte Stahlschrauben.
    - In Schwarz, Silber oder Orange.

    Mit 5 Jahren Garantie.
fr:
  title: 'Cockpit 35 : cintre Riser et potence Ultra'
  excerpt: Un serrage de 35 mm pour plus de rigidité et de contrôle en terrain technique.
  cta_label: Voir le cockpit
  body: |
    Le cockpit est le point de contact qui pilote le plus le vélo. C'est pourquoi nous l'avons conçu autour d'un serrage de **35 mm**.

    ## Cintre Riser 35

    - Aluminium 6061.
    - Rehausse de 40 ou 50 mm pour ajuster ta position.
    - En argent, platine et noir avec graphisme blanc, marron ou gris.

    Garanti à vie.

    ## Potence Ultra 35

    - Entièrement usinée CNC en aluminium 6061.
    - 35 mm de long et **120 g**.
    - Vis en acier zingué.
    - En noir, argent ou orange.

    Garantie 5 ans.
it:
  title: 'Cockpit 35: manubrio Riser e attacco Ultra'
  excerpt: Diametro 35 mm per più rigidità e controllo sul tecnico.
  cta_label: Vedi il cockpit
  body: |
    Il cockpit è il punto di contatto che controlla di più la bici. Per questo lo abbiamo progettato con diametro di **35 mm**.

    ## Manubrio Riser 35

    - Alluminio 6061.
    - Rise di 40 o 50 mm per regolare la posizione.
    - In argento, platino e nero con grafica bianca, marrone o grigia.

    Garanzia a vita.

    ## Attacco Ultra 35

    - Lavorato CNC al 100% in alluminio 6061.
    - 35 mm di lunghezza e **120 g**.
    - Viti in acciaio zincato.
    - In nero, argento o arancione.

    Garanzia 5 anni.
