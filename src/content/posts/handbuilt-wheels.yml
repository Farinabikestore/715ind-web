es:
  title: Nuevo armador de ruedas 715
  slug: handbuilt-wheels
  date: '2026-11-02'
  cover: /uploads/home/explora-armador.webp
  cover_mobile: /uploads/home/explora-armador-movil.webp
  excerpt: Diseña tus ruedas en 3D, pieza por pieza, y nosotros las armamos a mano en Chile.
  images:
  - /uploads/products/ultra-wheelset/rueda-trasera-715-1.webp
  - /uploads/products/ultra-wheelset/rueda-delantera-715-1.webp
  cta_label: Abrir el armador
  cta_link: /wheel-builder/
  body: |
    ## Diseña tus ruedas en 3D

    Con el **Armador de Ruedas** de 715 Industries eliges cada componente de tus ruedas —maza, llanta, tamaño, perforación y núcleo— mientras ves una vista 3D interactiva en tiempo real. Sabes cómo quedará tu rueda antes de pedirla.

    La herramienta quita la incertidumbre de armar ruedas a pedido: combina la flexibilidad de la personalización digital con el respaldo de un taller local.

    ## Ventajas del configurador

    - **Vista 3D en tiempo real:** mira al instante cómo se ve cada combinación de colores y acabados.
    - **Compatibilidad asegurada:** el armador filtra los componentes para que coincidan ejes (Boost), núcleos (Micro Spline, XD, HG) y número de hoyos.
    - **Resumen de tu configuración:** al terminar ves el detalle completo de tu rueda.
    - **Compra simple:** desde el armador pasas directo a comprar o cotizar en Fariña Bike Store, y la rueda se arma en taller.

    ## Ruedas a medida, sin importar

    Hasta ahora, quien buscaba ruedas a medida de alta gama solía recurrir a configuradores de marcas internacionales como Industry Nine, NOBL o Spank. El armador 715 ofrece algo distinto para Chile y Latinoamérica:

    - **Inmediatez y soporte local:** componentes disponibles en Chile, sin costos de importación, aduana ni largas esperas.
    - **Buena relación precio-rendimiento:** componentes de aluminio de alta resistencia, como la maza Ultra de 612 puntos de enganche, a un precio justo.
    - **Servicio técnico directo:** el armado, el centrado, los repuestos y las mantenciones se hacen en el país.

    ## Lo que va adentro

    Rayos Richman SR14 J-bend y niples Pillar de bronce 14G. La llanta Enduro H30 se arma con golillas de niple.
en:
  title: The new 715 wheel builder
  excerpt: Design your wheels in 3D, part by part, and we build them by hand in Chile.
  cta_label: Open the wheel builder
  body: |
    ## Design your wheels in 3D

    With the 715 Industries **Wheel Builder** you choose every part of your wheels —hub, rim, size, drilling and freehub— while an interactive 3D preview updates in real time. You know what your wheel will look like before you order it.

    It takes the guesswork out of custom wheels, combining the flexibility of digital customisation with the backing of a local workshop.

    ## Why use the builder

    - **Real-time 3D preview:** see every colour and finish combination instantly.
    - **Guaranteed compatibility:** the builder filters parts so axles (Boost), freehubs (Micro Spline, XD, HG) and hole counts match.
    - **Build summary:** when you finish you see the full spec of your wheel.
    - **Easy purchase:** go straight from the builder to buy or get a quote at Fariña Bike Store, and the wheel is built in the workshop.

    ## Custom wheels without importing

    Until now, riders after high-end custom wheels usually turned to configurators from international brands such as Industry Nine, NOBL or Spank. The 715 builder offers something different for Chile and Latin America:

    - **Speed and local support:** parts available in Chile, with no import costs, customs or long waits.
    - **Great value:** high-strength aluminium parts, like the 612-engagement Ultra hub, at a fair price.
    - **Direct service:** building, truing, spare parts and maintenance all happen in the country.

    ## What goes inside

    Richman SR14 J-bend spokes and Pillar 14G brass nipples. The Enduro H30 rim is built with nipple washers.
pt:
  title: O novo montador de rodas 715
  excerpt: Crie suas rodas em 3D, peça por peça, e nós as montamos à mão no Chile.
  cta_label: Abrir o montador
  body: |
    ## Crie suas rodas em 3D

    Com o **Montador de Rodas** da 715 Industries você escolhe cada componente das suas rodas —cubo, aro, tamanho, furação e núcleo— enquanto vê uma prévia 3D interativa em tempo real. Você sabe como sua roda vai ficar antes de pedir.

    A ferramenta tira a incerteza de montar rodas sob medida: une a flexibilidade da personalização digital ao apoio de uma oficina local.

    ## Vantagens do configurador

    - **Prévia 3D em tempo real:** veja na hora como fica cada combinação de cores e acabamentos.
    - **Compatibilidade garantida:** o montador filtra os componentes para que eixos (Boost), núcleos (Micro Spline, XD, HG) e número de furos combinem.
    - **Resumo da configuração:** ao terminar você vê o detalhe completo da sua roda.
    - **Compra simples:** do montador você vai direto comprar ou pedir orçamento na Fariña Bike Store, e a roda é montada na oficina.

    ## Rodas sob medida sem importar

    Até agora, quem buscava rodas sob medida de alto nível costumava usar configuradores de marcas internacionais como Industry Nine, NOBL ou Spank. O montador 715 oferece algo diferente para o Chile e a América Latina:

    - **Rapidez e suporte local:** componentes disponíveis no Chile, sem custos de importação, alfândega ou longas esperas.
    - **Ótimo custo-benefício:** componentes de alumínio de alta resistência, como o cubo Ultra de 612 pontos de engate, a um preço justo.
    - **Assistência técnica direta:** montagem, centragem, peças de reposição e manutenção feitas no país.

    ## O que vai dentro

    Raios Richman SR14 J-bend e niples Pillar de latão 14G. O aro Enduro H30 é montado com arruelas de niple.
de:
  title: Der neue 715 Laufrad-Konfigurator
  excerpt: Gestalte deine Laufräder in 3D, Teil für Teil – wir bauen sie in Chile von Hand.
  cta_label: Zum Laufrad-Konfigurator
  body: |
    ## Laufräder in 3D gestalten

    Mit dem **Laufrad-Konfigurator** von 715 Industries wählst du jedes Teil deiner Laufräder – Nabe, Felge, Größe, Lochzahl und Freilauf – und siehst dabei eine interaktive 3D-Vorschau in Echtzeit. So weißt du vor der Bestellung, wie dein Laufrad aussieht.

    Das Tool nimmt die Unsicherheit aus Laufrädern nach Maß: digitale Individualisierung mit dem Rückhalt einer lokalen Werkstatt.

    ## Vorteile des Konfigurators

    - **3D-Vorschau in Echtzeit:** sieh sofort, wie jede Farb- und Finish-Kombination aussieht.
    - **Garantierte Kompatibilität:** der Konfigurator filtert die Teile, damit Achsen (Boost), Freiläufe (Micro Spline, XD, HG) und Lochzahl passen.
    - **Übersicht deiner Konfiguration:** am Ende siehst du alle Details deines Laufrads.
    - **Einfacher Kauf:** direkt vom Konfigurator zum Kauf oder Angebot bei Fariña Bike Store; das Laufrad wird in der Werkstatt gebaut.

    ## Laufräder nach Maß ohne Import

    Bisher griffen Fahrer, die hochwertige Laufräder nach Maß suchten, meist zu Konfiguratoren internationaler Marken wie Industry Nine, NOBL oder Spank. Der 715-Konfigurator bietet etwas anderes für Chile und Lateinamerika:

    - **Schnell und lokal betreut:** Teile in Chile verfügbar, ohne Importkosten, Zoll oder lange Wartezeiten.
    - **Gutes Preis-Leistungs-Verhältnis:** hochfeste Aluminiumteile wie die Ultra-Nabe mit 612 Eingriffspunkten zu einem fairen Preis.
    - **Direkter Service:** Aufbau, Zentrieren, Ersatzteile und Wartung im eigenen Land.

    ## Was drinsteckt

    Richman SR14 J-Bend-Speichen und Pillar 14G Messingnippel. Die Enduro H30 wird mit Nippelscheiben aufgebaut.
fr:
  title: Le nouveau configurateur de roues 715
  excerpt: Créez vos roues en 3D, pièce par pièce, et nous les montons à la main au Chili.
  cta_label: Ouvrir le configurateur
  body: |
    ## Créez vos roues en 3D

    Avec le **Configurateur de roues** de 715 Industries, vous choisissez chaque composant de vos roues —moyeu, jante, taille, perçage et corps de roue libre— avec un aperçu 3D interactif en temps réel. Vous savez à quoi ressemblera votre roue avant de la commander.

    L'outil enlève l'incertitude des roues sur mesure : la souplesse de la personnalisation numérique, avec le soutien d'un atelier local.

    ## Les avantages du configurateur

    - **Aperçu 3D en temps réel :** voyez immédiatement chaque combinaison de couleurs et de finitions.
    - **Compatibilité garantie :** le configurateur filtre les composants pour que les axes (Boost), les corps de roue libre (Micro Spline, XD, HG) et le nombre de trous correspondent.
    - **Récapitulatif :** à la fin, vous voyez le détail complet de votre roue.
    - **Achat simple :** du configurateur, vous passez directement à l'achat ou au devis chez Fariña Bike Store, et la roue est montée en atelier.

    ## Des roues sur mesure sans importer

    Jusqu'ici, les riders en quête de roues haut de gamme sur mesure passaient souvent par les configurateurs de marques internationales comme Industry Nine, NOBL ou Spank. Le configurateur 715 propose autre chose pour le Chili et l'Amérique latine :

    - **Rapidité et support local :** composants disponibles au Chili, sans frais d'importation, douane ni longues attentes.
    - **Excellent rapport qualité-prix :** des composants en aluminium haute résistance, comme le moyeu Ultra à 612 points d'engagement, à un prix juste.
    - **Service technique direct :** montage, dévoilage, pièces détachées et entretien se font dans le pays.

    ## Ce qu'il y a dedans

    Rayons Richman SR14 J-bend et écrous Pillar en laiton 14G. La jante Enduro H30 se monte avec des rondelles d'écrou.
it:
  title: Il nuovo configuratore di ruote 715
  excerpt: Progetta le tue ruote in 3D, pezzo per pezzo, e noi le montiamo a mano in Cile.
  cta_label: Apri il configuratore
  body: |
    ## Progetta le tue ruote in 3D

    Con il **Configuratore di ruote** di 715 Industries scegli ogni componente delle tue ruote —mozzo, cerchio, misura, foratura e corpetto— mentre vedi un'anteprima 3D interattiva in tempo reale. Sai come sarà la tua ruota prima di ordinarla.

    Lo strumento toglie l'incertezza dalle ruote su misura: la flessibilità della personalizzazione digitale con il supporto di un'officina locale.

    ## I vantaggi del configuratore

    - **Anteprima 3D in tempo reale:** guarda subito ogni combinazione di colori e finiture.
    - **Compatibilità garantita:** il configuratore filtra i componenti perché assi (Boost), corpetti (Micro Spline, XD, HG) e numero di fori combacino.
    - **Riepilogo della configurazione:** alla fine vedi il dettaglio completo della tua ruota.
    - **Acquisto semplice:** dal configuratore passi direttamente all'acquisto o al preventivo su Fariña Bike Store, e la ruota viene montata in officina.

    ## Ruote su misura senza importare

    Finora chi cercava ruote su misura di alta gamma si rivolgeva di solito ai configuratori di marchi internazionali come Industry Nine, NOBL o Spank. Il configuratore 715 offre qualcosa di diverso per il Cile e l'America Latina:

    - **Rapidità e supporto locale:** componenti disponibili in Cile, senza costi di importazione, dogana o lunghe attese.
    - **Ottimo rapporto qualità-prezzo:** componenti in alluminio ad alta resistenza, come il mozzo Ultra a 612 punti di innesto, a un prezzo giusto.
    - **Assistenza diretta:** montaggio, centratura, ricambi e manutenzione si fanno nel paese.

    ## Cosa c'è dentro

    Raggi Richman SR14 J-bend e nipples Pillar in ottone 14G. Il cerchio Enduro H30 si monta con rondelle per nipples.
