es:
  title: 'Ruedas 715: armadas a mano en Santiago'
  slug: handbuilt-wheels
  date: 2026-10-14
  cover: /uploads/products/ultra-wheelset/wheelset-715-ind-1.webp
  excerpt: Tú eliges cada pieza. Nosotros la armamos y tensamos a mano.
  images:
  - /uploads/products/ultra-wheelset/rueda-trasera-715-1.webp
  - /uploads/products/ultra-wheelset/rueda-delantera-715-1.webp
  cta_label: Abrir el armador
  cta_link: /wheel-builder/
  body: |
    Cada rueda 715 se arma y tensa a mano en nuestro taller de Santiago. Conocemos cada combinación de llanta, maza y largo de rayo.

    ## Tú eliges

    - **Llanta:** Enduro H30 o E30 Ultra.
    - **Maza:** Ultra, Trail o delantera 15x110.
    - **Tamaño:** 27,5" o 29", en 28 o 32 hoyos.
    - **Colores y núcleo:** Shimano HG, Micro Spline o SRAM XD.

    ## Lo que va adentro

    Rayos Richman SR14 J-bend y niples Pillar de bronce 14G. La llanta Enduro H30 se arma con golillas de niple.

    ## Cómo pedirla

    Configura tu rueda en el armador, mírala en 3D y envíanos la solicitud.
en:
  title: '715 wheels: hand-built in Santiago'
  excerpt: You choose every part. We build and tension it by hand.
  cta_label: Open the wheel builder
  body: |
    Every 715 wheel is built and tensioned by hand in our Santiago workshop. We know every combination of rim, hub and spoke length.

    ## You choose

    - **Rim:** Enduro H30 or E30 Ultra.
    - **Hub:** Ultra, Trail or 15x110 front.
    - **Size:** 27.5" or 29", 28 or 32 holes.
    - **Colours and freehub:** Shimano HG, Micro Spline or SRAM XD.

    ## What goes inside

    Richman SR14 J-bend spokes and Pillar 14G brass nipples. The Enduro H30 rim is built with nipple washers.

    ## How to order

    Set up your wheel in the builder, see it in 3D and send us the request.
pt:
  title: 'Rodas 715: montadas à mão em Santiago'
  excerpt: Você escolhe cada peça. Nós montamos e tensionamos à mão.
  cta_label: Abrir o montador
  body: |
    Cada roda 715 é montada e tensionada à mão na nossa oficina em Santiago. Conhecemos cada combinação de aro, cubo e comprimento de raio.

    ## Você escolhe

    - **Aro:** Enduro H30 ou E30 Ultra.
    - **Cubo:** Ultra, Trail ou dianteiro 15x110.
    - **Tamanho:** 27,5" ou 29", com 28 ou 32 furos.
    - **Cores e núcleo:** Shimano HG, Micro Spline ou SRAM XD.

    ## O que vai dentro

    Raios Richman SR14 J-bend e niples Pillar de latão 14G. O aro Enduro H30 é montado com arruelas de niple.

    ## Como pedir

    Configure sua roda no montador, veja em 3D e envie a solicitação.
de:
  title: '715 Laufräder: von Hand gebaut in Santiago'
  excerpt: Du wählst jedes Teil. Wir bauen und spannen von Hand.
  cta_label: Zum Laufrad-Konfigurator
  body: |
    Jedes 715 Laufrad wird in unserer Werkstatt in Santiago von Hand gebaut und gespannt. Wir kennen jede Kombination aus Felge, Nabe und Speichenlänge.

    ## Du wählst

    - **Felge:** Enduro H30 oder E30 Ultra.
    - **Nabe:** Ultra, Trail oder Front 15x110.
    - **Größe:** 27,5" oder 29", 28 oder 32 Löcher.
    - **Farben und Freilauf:** Shimano HG, Micro Spline oder SRAM XD.

    ## Was drinsteckt

    Richman SR14 J-Bend-Speichen und Pillar 14G Messingnippel. Die Enduro H30 wird mit Nippelscheiben aufgebaut.

    ## So bestellst du

    Konfiguriere dein Laufrad, sieh es dir in 3D an und schick uns die Anfrage.
fr:
  title: 'Roues 715 : montées à la main à Santiago'
  excerpt: Tu choisis chaque pièce. Nous la montons et la tendons à la main.
  cta_label: Ouvrir le configurateur
  body: |
    Chaque roue 715 est montée et tendue à la main dans notre atelier de Santiago. Nous connaissons chaque combinaison de jante, moyeu et longueur de rayon.

    ## Tu choisis

    - **Jante :** Enduro H30 ou E30 Ultra.
    - **Moyeu :** Ultra, Trail ou avant 15x110.
    - **Taille :** 27,5" ou 29", 28 ou 32 trous.
    - **Couleurs et corps de roue libre :** Shimano HG, Micro Spline ou SRAM XD.

    ## Ce qu'il y a dedans

    Rayons Richman SR14 J-bend et écrous Pillar en laiton 14G. La jante Enduro H30 se monte avec des rondelles d'écrou.

    ## Comment commander

    Configure ta roue, regarde-la en 3D et envoie-nous la demande.
it:
  title: 'Ruote 715: montate a mano a Santiago'
  excerpt: Scegli ogni pezzo. Noi la montiamo e tensioniamo a mano.
  cta_label: Apri il configuratore
  body: |
    Ogni ruota 715 viene montata e tensionata a mano nella nostra officina di Santiago. Conosciamo ogni combinazione di cerchio, mozzo e lunghezza dei raggi.

    ## Scegli tu

    - **Cerchio:** Enduro H30 o E30 Ultra.
    - **Mozzo:** Ultra, Trail o anteriore 15x110.
    - **Misura:** 27,5" o 29", 28 o 32 fori.
    - **Colori e corpetto:** Shimano HG, Micro Spline o SRAM XD.

    ## Cosa c'è dentro

    Raggi Richman SR14 J-bend e nipples Pillar in ottone 14G. Il cerchio Enduro H30 si monta con rondelle per nipples.

    ## Come ordinarla

    Configura la tua ruota, guardala in 3D e inviaci la richiesta.
