es:
  title: Desarrollo del nuevo 715 Ranger
  slug: ranger
  date: '2026-11-02'
  cover: /uploads/products/ranger/bike-ranger-preventa-1.webp
  excerpt: La primera doble suspensión de 715 Industries, con geometría agresiva y componentes de primer nivel para el enduro chileno.
  images:
  - /uploads/products/ranger/bike-ranger-preventa-2.webp
  - /uploads/products/ranger/bike-ranger-frame-only-preventa-1.webp
  - /uploads/products/ranger/bike-ranger-preventa-3.webp
  cta_label: Ver la Ranger
  cta_link: /products/ranger/
  body: |
    ## De un sueño independiente al gran salto doble

    715 Industries nació de una visión apasionada por el mountain bike en Chile: componentes y cuadros rígidos creados por y para riders locales. Tras consolidar sus plataformas hardtail, el gran desafío pendiente era dar el salto a una doble suspensión. El primer proyecto tuvo tropiezos técnicos, como limitaciones en la inserción del tubo de asiento en las tallas pequeñas. Lejos de abandonar la idea, el equipo refinó la ingeniería junto a fabricantes especializados en aluminio de Taiwán hasta lograr una plataforma robusta y competitiva.

    ## Geometría progresiva y especificaciones clave

    El **715 Ranger** se diseñó con una concepción de superenduro: estabilidad en los descensos más rápidos y buena eficiencia de pedaleo en subidas técnicas.

    - **Recorrido agresivo:** 170 mm adelante y 160 mm atrás, para absorber impactos fuertes en bikeparks y circuitos exigentes.
    - **Geometría adaptada:** dirección relajada de 63° y vainas cortas de 435 mm, para agilidad y control.
    - **Sistema de suspensión:** todos los pivotes giran sobre rodamientos sellados de alta durabilidad con pernos de aluminio, para resistir el barro y el uso intenso.

    ## Versatilidad y estándares de montaje

    Pensando en la autonomía de quienes andan en cerro, la Ranger usa estándares universales y de fácil mantención. La caja pedalera roscada BSA de 68/73 mm facilita el servicio, y la patilla universal **UDH** lo deja listo para las transmisiones modernas. El tubo de asiento de 31,6 mm con abrazadera de 34,9 mm admite tijas telescópicas de gran recorrido (hasta 150 mm en talla S), lo que resuelve las limitaciones de los primeros prototipos y deja un cuadro versátil, resistente y listo para competir.
en:
  title: Developing the new 715 Ranger
  excerpt: 715 Industries' first full suspension, with aggressive geometry and top-level components for Chilean enduro.
  cta_label: See the Ranger
  body: |
    ## From an independent dream to the full-suspension leap

    715 Industries was born from a passion for mountain biking in Chile: components and hardtail frames made by and for local riders. With its hardtail platforms established, the big remaining challenge was a full-suspension bike. The first project ran into technical setbacks, such as limited seat tube insertion on small sizes. Instead of giving up, the team refined the engineering with specialist aluminium manufacturers in Taiwan until it reached a tough, competitive platform.

    ## Progressive geometry and key specs

    The **715 Ranger** was designed as a super-enduro bike: stable on the fastest descents and efficient on technical climbs.

    - **Aggressive travel:** 170 mm front and 160 mm rear, to soak up big hits in bike parks and demanding trails.
    - **Dialled geometry:** a slack 63° head angle and short 435 mm chainstays for agility and control.
    - **Suspension system:** every pivot runs on durable sealed bearings with aluminium bolts, built to handle mud and hard use.

    ## Versatility and standards

    With self-sufficient mountain riders in mind, the Ranger uses universal, easy-to-service standards. The threaded BSA 68/73 mm bottom bracket makes servicing simple, and the universal **UDH** derailleur hanger makes it ready for modern drivetrains. The 31.6 mm seat tube with a 34.9 mm clamp takes long-travel dropper posts (up to 150 mm on size S), solving the limits of the first prototypes for a versatile, tough frame that is ready to race.
pt:
  title: Desenvolvimento da nova 715 Ranger
  excerpt: A primeira full suspension da 715 Industries, com geometria agressiva e componentes de alto nível para o enduro chileno.
  cta_label: Ver a Ranger
  body: |
    ## De um sonho independente ao grande salto

    A 715 Industries nasceu da paixão pelo mountain bike no Chile: componentes e quadros hardtail feitos por e para riders locais. Depois de consolidar suas plataformas hardtail, o grande desafio era dar o salto para uma full suspension. O primeiro projeto teve contratempos técnicos, como a inserção limitada do canote nos tamanhos pequenos. Em vez de desistir, a equipe refinou a engenharia com fabricantes de alumínio especializados em Taiwan até chegar a uma plataforma robusta e competitiva.

    ## Geometria progressiva e especificações

    A **715 Ranger** foi projetada como uma bike de superenduro: estável nas descidas mais rápidas e eficiente nas subidas técnicas.

    - **Curso agressivo:** 170 mm na frente e 160 mm atrás, para absorver impactos fortes em bike parks e trilhas exigentes.
    - **Geometria ajustada:** caixa de direção relaxada de 63° e chainstays curtos de 435 mm, para agilidade e controle.
    - **Sistema de suspensão:** todos os pivôs giram sobre rolamentos selados de alta durabilidade com parafusos de alumínio, para aguentar lama e uso intenso.

    ## Versatilidade e padrões

    Pensando na autonomia de quem pedala na montanha, a Ranger usa padrões universais e de fácil manutenção. O movimento central rosqueado BSA 68/73 mm facilita a manutenção, e a gancheira universal **UDH** a deixa pronta para as transmissões modernas. O tubo de selim de 31,6 mm com abraçadeira de 34,9 mm aceita canotes retráteis de longo curso (até 150 mm no tamanho S), resolvendo as limitações dos primeiros protótipos.
de:
  title: Die Entwicklung des neuen 715 Ranger
  excerpt: 'Das erste Fully von 715 Industries: aggressive Geometrie und hochwertige Komponenten für Enduro in Chile.'
  cta_label: Zum Ranger
  body: |
    ## Vom unabhängigen Traum zum Sprung aufs Fully

    715 Industries entstand aus der Leidenschaft fürs Mountainbiken in Chile: Komponenten und Hardtail-Rahmen von und für lokale Fahrer. Nachdem sich die Hardtails etabliert hatten, war ein Fully die große offene Herausforderung. Das erste Projekt hatte technische Rückschläge, etwa eine begrenzte Sattelstützen-Einstecktiefe in kleinen Größen. Statt aufzugeben, verfeinerte das Team die Konstruktion mit spezialisierten Aluminium-Herstellern in Taiwan, bis eine robuste, konkurrenzfähige Plattform stand.

    ## Progressive Geometrie und wichtige Daten

    Der **715 Ranger** wurde als Super-Enduro konzipiert: stabil in schnellsten Abfahrten und effizient in technischen Anstiegen.

    - **Viel Federweg:** 170 mm vorne und 160 mm hinten, für harte Schläge im Bikepark und auf anspruchsvollen Trails.
    - **Durchdachte Geometrie:** flacher 63°-Lenkwinkel und kurze 435-mm-Kettenstreben für Wendigkeit und Kontrolle.
    - **Hinterbau:** alle Lager sind langlebige gedichtete Kugellager mit Aluminiumschrauben, gemacht für Schlamm und harten Einsatz.

    ## Vielseitigkeit und Standards

    Für selbstständige Bergfahrer setzt der Ranger auf universelle, wartungsfreundliche Standards. Das BSA-Gewinde-Tretlager (68/73 mm) erleichtert den Service, das universelle **UDH**-Schaltauge macht ihn bereit für moderne Antriebe. Das 31,6-mm-Sitzrohr mit 34,9-mm-Klemme nimmt Vario-Stützen mit viel Hub auf (bis 150 mm in Größe S) und löst damit die Grenzen der ersten Prototypen.
fr:
  title: Le développement du nouveau 715 Ranger
  excerpt: Le premier tout-suspendu de 715 Industries, avec une géométrie agressive et des composants haut de gamme pour l'enduro chilien.
  cta_label: Voir le Ranger
  body: |
    ## D'un rêve indépendant au grand saut

    715 Industries est né d'une passion pour le VTT au Chili : des composants et des cadres semi-rigides conçus par et pour les riders locaux. Une fois ses semi-rigides bien établis, le grand défi restait le tout-suspendu. Le premier projet a connu des revers techniques, comme une insertion de tige de selle limitée dans les petites tailles. Plutôt que d'abandonner, l'équipe a affiné l'ingénierie avec des fabricants taïwanais spécialisés dans l'aluminium jusqu'à obtenir une plateforme robuste et compétitive.

    ## Géométrie progressive et caractéristiques clés

    Le **715 Ranger** a été pensé comme un super-enduro : stable dans les descentes les plus rapides et efficace dans les montées techniques.

    - **Débattement généreux :** 170 mm à l'avant et 160 mm à l'arrière, pour encaisser les gros chocs en bike park et sur les sentiers exigeants.
    - **Géométrie affûtée :** angle de direction couché de 63° et bases courtes de 435 mm, pour l'agilité et le contrôle.
    - **Suspension :** tous les pivots tournent sur des roulements étanches durables avec des vis en aluminium, faits pour la boue et l'usage intensif.

    ## Polyvalence et standards

    Pensé pour les riders autonomes, le Ranger utilise des standards universels et faciles à entretenir. Le boîtier de pédalier fileté BSA 68/73 mm simplifie l'entretien, et la patte de dérailleur universelle **UDH** le prépare aux transmissions modernes. Le tube de selle de 31,6 mm avec collier de 34,9 mm accepte des tiges télescopiques à grand débattement (jusqu'à 150 mm en taille S), ce qui règle les limites des premiers prototypes.
it:
  title: Lo sviluppo della nuova 715 Ranger
  excerpt: La prima biammortizzata di 715 Industries, con geometria aggressiva e componenti di alto livello per l'enduro cileno.
  cta_label: Vedi la Ranger
  body: |
    ## Da un sogno indipendente al grande salto

    715 Industries è nata dalla passione per la mountain bike in Cile: componenti e telai front creati da e per rider locali. Dopo aver consolidato le sue front, la grande sfida era il salto alla biammortizzata. Il primo progetto ha avuto intoppi tecnici, come un inserimento limitato del reggisella nelle taglie piccole. Invece di rinunciare, il team ha affinato l'ingegneria con produttori di alluminio specializzati a Taiwan fino a ottenere una piattaforma robusta e competitiva.

    ## Geometria progressiva e specifiche chiave

    La **715 Ranger** è stata progettata come una super-enduro: stabile nelle discese più veloci ed efficiente nelle salite tecniche.

    - **Escursione generosa:** 170 mm davanti e 160 mm dietro, per assorbire colpi forti nei bike park e sui sentieri impegnativi.
    - **Geometria studiata:** angolo sterzo aperto di 63° e foderi corti di 435 mm, per agilità e controllo.
    - **Sospensione:** tutti i perni ruotano su cuscinetti sigillati di lunga durata con viti in alluminio, pensati per fango e uso intenso.

    ## Versatilità e standard

    Pensata per i rider autonomi, la Ranger usa standard universali e facili da mantenere. Il movimento centrale filettato BSA 68/73 mm semplifica la manutenzione e il forcellino universale **UDH** la rende pronta per le trasmissioni moderne. Il tubo sella da 31,6 mm con collarino da 34,9 mm accetta reggisella telescopici a lunga escursione (fino a 150 mm in taglia S), risolvendo i limiti dei primi prototipi.
