    La Ultra es la maza que usamos en nuestras propias ruedas. Su mecanismo de 6 trinquetes engancha cada 0,55°, así la potencia llega a la rueda apenas empiezas a pedalear, incluso en subidas técnicas.

    El cuerpo está mecanizado en aluminio 7075-T6 y lleva rodamientos de alta precisión. Acepta núcleos Shimano HG, Shimano Micro Spline y SRAM XD.
